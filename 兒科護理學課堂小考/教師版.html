<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兒科護理學課堂小考－教師版：答案與出處</title><style>
:root{--forest:#164a41;--leaf:#28755f;--mist:#e7f2ec;--sun:#e8b75b;--ink:#17221f;--paper:#fcfdfb}*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.65}.wrap{max-width:920px;margin:auto;padding:32px 20px 72px}header{background:linear-gradient(135deg,var(--forest),var(--leaf));color:#fff;padding:30px;border-radius:18px;margin-bottom:22px}h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.2rem)}.meta{opacity:.93;margin:0}.notice{background:#fff8e8;border-left:5px solid var(--sun);padding:14px 16px;border-radius:8px;margin:18px 0}.question{background:var(--paper);border:1px solid #d6e3dc;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 3px 10px #164a410d}.qhead{font-weight:700;color:var(--forest);font-size:.95rem}.stem{font-weight:600;font-size:1.08rem;margin:8px 0 14px}.option{display:block;border:1px solid #d9e2dd;border-radius:9px;margin:9px 0;padding:10px 12px;cursor:pointer}.option:hover{background:var(--mist)}input{margin-right:9px;accent-color:var(--leaf)}button{border:0;border-radius:9px;background:var(--forest);color:#fff;font:inherit;font-weight:700;padding:12px 22px;cursor:pointer}.actions{position:sticky;bottom:16px;background:#ffffffdf;padding:12px;border-radius:12px;box-shadow:0 3px 14px #0002;text-align:center}.result{display:none;background:#e3f4e9;border:1px solid #9ecbad;padding:16px;border-radius:10px;margin:20px 0;font-weight:700}.feedback{display:none;margin-top:10px;padding:9px 12px;border-radius:8px}.correct{background:#e4f5e8;color:#185e31}.wrong{background:#ffe8e7;color:#8b2621}.key{display:none;background:#f4f0df;border-left:5px solid var(--sun);padding:12px;border-radius:8px;margin-top:10px}.teacher .key{display:block}.source{color:#5c6b64;font-size:.82rem;margin-top:10px}footer{color:#5c6b64;font-size:.88rem;margin-top:24px}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.actions,.notice{display:none}.question{box-shadow:none;break-inside:avoid}}
</style></head><body class="teacher"><main class="wrap"><header><h1>兒科護理學課堂小考</h1><p class="meta">106–115 年護理師國考題｜共 20 題｜每年 2 題｜教師版：答案與出處</p></header><div class="notice">題目與官方答案均取自本機「護理師國考題」資料庫之產兒科護理學；學生卷完成後按「批閱」即可看到得分與每題對錯。</div><div id="result" class="result"></div><section id="questions"></section><div class="actions"><button type="button" onclick="gradeQuiz()">批閱</button></div><footer>資料依據：護理師國考題／各題所列年度、場次、題號與原始試題 PDF。僅供課堂練習使用。</footer></main><script>
const teacher=true; const questions=[{"year":"106","session":"第一次","number":"45","stem":"下列何種藥物可能與雷氏症候群（Reye syndrome）有關，不建議兒童使用？","options":{"A":"Acetaminophen","B":"Ibuprofen","C":"Ketorolac","D":"Aspirin"},"answer":"D","source":"pdf/106/106030/106-0504-Q-1.pdf"},{"year":"106","session":"第一次","number":"46","stem":"有關兒童肌肉注射部位的考量，下列敘述何者正確？","options":{"A":"股內側肌神經血管少，適合為0～2 歲病童注射","B":"腹臀肌神經血管少，適合為0～2 歲病童注射","C":"背臀肌吸收最迅速，但6 歲以下兒童儘量避免使用","D":"上臂三角肌吸收最迅速，適合國小學童預防注射"},"answer":"D","source":"pdf/106/106030/106-0504-Q-1.pdf"},{"year":"107","session":"第一次","number":"41","stem":"依據民國104 年修正之「兒童及少年福利與權益保障法」，此法所稱之兒童及少年是指未滿幾歲之人？","options":{"A":"12 歲","B":"14 歲","C":"15 歲","D":"18 歲"},"answer":"D","source":"pdf/107/107030/106-0504-Q-1.pdf"},{"year":"107","session":"第一次","number":"45","stem":"兒童的復發性腹痛（recurrent abdominal pain）會具有下列何項特徵？①腹痛會出現在肚臍周圍 ②是一種轉移性的腹痛 ③解出鬆軟的大便 ④腹痛時間是不規律的 ⑤會伴隨體溫升高","options":{"A":"①③④","B":"①④⑤","C":"②③⑤","D":"②④⑤"},"answer":"A","source":"pdf/107/107030/106-0504-Q-1.pdf"},{"year":"108","session":"第一次","number":"41","stem":"有關異物吸入造成兒童輕微支氣管阻塞的症狀描述，下列何者錯誤？","options":{"A":"作嘔","B":"咳嗽","C":"無法說話","D":"哮喘"},"answer":"C","source":"pdf/108/108020/106-0504-Q-1.pdf"},{"year":"108","session":"第一次","number":"42","stem":"下列何者是2 歲幼兒對疼痛最不常採取的反應？","options":{"A":"大聲哭泣、尖叫，有生氣的表情","B":"抱住父母或他人，尋求情緒上的支持","C":"出現拖延的行為，如：我要去尿尿","D":"手腳扭動、踢人，不肯合作"},"answer":"C","source":"pdf/108/108020/106-0504-Q-1.pdf"},{"year":"109","session":"第一次","number":"41","stem":"下列何種中毒情況適合為兒童進行催吐？","options":{"A":"小於6 個月嬰兒口服藥物中毒","B":"3 歲幼兒誤食杜鵑花葉導致昏迷","C":"4 歲兒童誤食有毒磨菇","D":"5 歲兒童誤食廚房清潔劑"},"answer":"C","source":"pdf/109/109030/106-0504-Q-1.pdf"},{"year":"109","session":"第一次","number":"42","stem":"依據丹佛II 嬰幼兒發展篩檢測驗（DDST-II）評估來健兒門診的王小妹，她能自己扣鈕釦、用手指夾葡萄乾、單腳站立5 秒鐘，王小妹大約是幾歲？","options":{"A":"1～1.5 歲","B":"2～2.5 歲","C":"3～3.5 歲","D":"4～4.5 歲"},"answer":"D","source":"pdf/109/109030/106-0504-Q-1.pdf"},{"year":"110","session":"第一次","number":"41","stem":"依據「兒童及少年福利與權益保障法」第53 條，當護理師知悉兒童非法施用毒品或管制藥品、遭受虐待或其他傷害，至遲不得超過幾小時，應立即向主管機關通報？","options":{"A":"12 小時","B":"24 小時","C":"36 小時","D":"48 小時"},"answer":"B","source":"pdf/110/110030/104-0304-Q-1.pdf"},{"year":"110","session":"第一次","number":"45","stem":"小瑄，1 歲1 個月，因不明原因發燒而入住兒童病房，測量小瑄的生命徵象時，下列護理措施何者較不適當？","options":{"A":"採肛溫測量以獲得正確體溫","B":"讓主要照顧者陪伴在身旁","C":"先量呼吸、心跳再量體溫","D":"血壓測量部位最常用為右上臂"},"answer":"A","source":"pdf/110/110030/104-0304-Q-1.pdf"},{"year":"111","session":"第一次","number":"41","stem":"因應少子化時代來臨，為保護兒童，兒童及少年福利與權益保障法規，下列何者錯誤？","options":{"A":"醫護人員執行業務時知悉兒童及青少年有施用毒品時，應於24 小時內通報相關主管機關","B":"兒童及少年福利與權益保障法主要保護20 歲以下之兒童及青少年","C":"任何人對兒童及少年不得有遺棄、身心虐待、猥褻或性交行為","D":"孕婦不得吸菸、酗酒、嚼檳榔或施用毒品等有害胎兒發育之行為"},"answer":"B","source":"pdf/111/111030/104-0304-Q-1.pdf"},{"year":"111","session":"第一次","number":"43","stem":"有關遭受性虐待後之兒童可能出現的行為表現，下列敘述何者不適當？","options":{"A":"害怕獨處，討厭他人碰觸身體","B":"出現複雜或不合宜的性知識概念","C":"攻擊性強，說謊行為，但無身體發展遲滯","D":"情緒沮喪退縮，對他人充滿敵意、不信任"},"answer":"C","source":"pdf/111/111030/104-0304-Q-1.pdf"},{"year":"112","session":"第一次","number":"44","stem":"針對嬰幼兒生長發展情況之敘述，下列何者錯誤？","options":{"A":"2 歲身高約成人身高的一半","B":"前囟門約1 歲半時關閉","C":"1 歲時腎絲球過濾率達成人標準","D":"觸覺是感覺器官中最早發育的"},"answer":"C","source":"pdf/112/112030/102-0204-Q-1.pdf"},{"year":"112","session":"第一次","number":"45","stem":"嬰幼兒誤食色彩鮮豔的糖果紙、廣告紙、顏料等，容易引起下列何種物質的中毒，造成中樞神經系統的損傷？","options":{"A":"鉛","B":"鐵","C":"銅","D":"塑化劑"},"answer":"A","source":"pdf/112/112030/102-0204-Q-1.pdf"},{"year":"113","session":"第一次","number":"41","stem":"有關嬰幼兒缺鐵性貧血（iron deficiency anemia）之敘述，下列何者正確？","options":{"A":"屬體染色體隱性遺傳疾病","B":"常發生於6～24個月大的足月兒","C":"紅血球體積比正常紅血球大","D":"長期貧血可能導致心跳過慢之代償反應"},"answer":"B","source":"pdf/113/113030/101-44-Q-1.pdf"},{"year":"113","session":"第一次","number":"42","stem":"小華，6個月，罹患兒童癌症，目前接受化學治療且須治療半年以上，則小華可以接種下列何種疫苗？","options":{"A":"四合一疫苗（Tdap-IPV）","B":"水痘疫苗","C":"輪狀病毒疫苗","D":"麻疹腮腺炎德國麻疹混合疫苗"},"answer":"A","source":"pdf/113/113030/101-44-Q-1.pdf"},{"year":"114","session":"第一次","number":"41","stem":"有關海洋性貧血兒童使用排鐵劑（deferoxamine）治療，下列敘述何者錯誤？","options":{"A":"排鐵過程尿液會呈現紅色或橘紅色","B":"適應的年齡為5～7歲，因遵從性會更好","C":"排鐵過程需補充維他命C","D":"可以皮下注射，宜在晚間執行"},"answer":"B","source":"pdf/114/114030/101-0104-Q-1.pdf"},{"year":"114","session":"第一次","number":"50","stem":"小美，15個月大，從樓梯跌落導致頭部受傷，急診護理師依據兒童適用之葛氏昏迷量表（Glasgow coma scale, GCS）評估其意識程度，結果顯示叫他時會睜眼，雖會哭泣但可安撫，輕觸其手臂會收縮反應，請問小美的昏迷指數為幾分？","options":{"A":"7分","B":"9分","C":"12分","D":"15分"},"answer":"C","source":"pdf/114/114030/101-0104-Q-1.pdf"},{"year":"115","session":"第一次","number":"50","stem":"有關腦性麻痺兒童之敘述，下列何者錯誤？","options":{"A":"長時間的腦部缺氧，是出生前和生產時最常發生的致病原因","B":"智能障礙為主要發展問題，應於學會溝通後開始接受語言訓練","C":"屬於非進行式的運動功能障礙","D":"身體特徵為伸展反射、深層肌腱反射及肌肉張力增加"},"answer":"B","source":"pdf/115/115030/101-0104-Q-1.pdf"},{"year":"115","session":"第二次","number":"47","stem":"小志，6 個月，男嬰，半夜突然大哭，雙腳屈膝、臉色蒼白、嘔吐物中含膽汁，數分鐘後緩解，20 分鐘後又再次出現上述症狀。檢查尿布，發現大便中含血與黏膜。根據上述症狀，小志可能有什麼健康問題？","options":{"A":"胃食道逆流","B":"腸套疊","C":"幽門狹窄","D":"巨結腸症"},"answer":"B","source":"pdf/115/115100/102-0204-Q-1.pdf"}];
const letters=['A','B','C','D']; const box=document.querySelector('#questions');
box.innerHTML=questions.map((q,i)=>`<article class="question" id="q${i}"><div class="qhead">第 ${i+1} 題｜${q.year} 年 ${q.session}｜產兒科護理學 第 ${q.number} 題</div><div class="stem">${q.stem}</div>${letters.map(l=>`<label class="option"><input type="radio" name="q${i}" value="${l}"> <b>${l}.</b> ${q.options[l]}</label>`).join('')}<div class="feedback" id="f${i}"></div><div class="key">官方答案：<b>${q.answer}</b>．${q.options[q.answer]}</div><div class="source">資料依據：${q.year} 年${q.session}產兒科護理學第 ${q.number} 題／${q.source}</div></article>`).join('');
function gradeQuiz(){let score=0,answered=0;questions.forEach((q,i)=>{const chosen=document.querySelector(`input[name="q${i}"]:checked`);const f=document.querySelector(`#f${i}`);f.style.display='block';if(!chosen){f.textContent=`未作答；正確答案：${q.answer}`;f.className='feedback wrong';return}answered++;if(chosen.value===q.answer){score++;f.textContent='答對';f.className='feedback correct'}else{f.textContent=`答錯；正確答案：${q.answer}．${q.options[q.answer]}`;f.className='feedback wrong'}});const r=document.querySelector('#result');r.style.display='block';r.textContent=`作答 ${answered}/20 題，答對 ${score} 題，得分 ${score*5}/100 分。`;window.scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
