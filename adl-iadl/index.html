<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="亞洲大學長期照護學系 高齡周全性健康評估與實作 第7週：日常生活活動功能（ADL）與工具式日常生活活動功能（IADL）教材、情境實作與評估單">
<title>ADL與IADL評估實作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky header with two modes (學習 / 評估單); 評估單 = unit rail on the left + item cards, one item answered after another. */
:root{
  --paper:#F3F6F6; --surface:#FFFFFF; --sunk:#E9EFEF; --ink:#14232B; --muted:#56676E; --line:#D3DDDF;
  --accent:#0E6767; --accent-ink:#FFFFFF; --accent-soft:#DDEFEE;
  --vision:#A84C0A; --vision-soft:#FBEADB; --hearing:#2A5BA6; --hearing-soft:#E2EBF8;
  --ok:#2C7A47; --ok-soft:#E1F1E6; --warn:#B3261E; --warn-soft:#FBE4E1;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1618; --surface:#162125; --sunk:#1C2A2F; --ink:#E3ECEE; --muted:#93A6AC; --line:#2B3B40;
  --accent:#5EC3BE; --accent-ink:#06201F; --accent-soft:#163533;
  --vision:#F0A262; --vision-soft:#3A2617; --hearing:#91B5F2; --hearing-soft:#1A2A43;
  --ok:#73C98F; --ok-soft:#173225; --warn:#F28B82; --warn-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1618; --surface:#162125; --sunk:#1C2A2F; --ink:#E3ECEE; --muted:#93A6AC; --line:#2B3B40;
  --accent:#5EC3BE; --accent-ink:#06201F; --accent-soft:#163533;
  --vision:#F0A262; --vision-soft:#3A2617; --hearing:#91B5F2; --hearing-soft:#1A2A43;
  --ok:#73C98F; --ok-soft:#173225; --warn:#F28B82; --warn-soft:#3B1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.brand h1{font-size:19px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:progress}
.progress{height:3px;background:var(--sunk)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* learn */
.learn{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-block:24px 60px}
.toc{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:14px}
.toc h4{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.toc a{color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:6px;border-left:3px solid transparent}
.toc a:hover{background:var(--sunk)}
.toc a.v{border-left-color:var(--vision)} .toc a.h{border-left-color:var(--hearing)} .toc a.a{border-left-color:var(--accent)}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:12px}
.intro h2{font-size:24px}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{background:var(--sunk);border-radius:8px;padding:8px 14px;min-width:150px}
.fact b{font-family:var(--f-mono);font-size:22px;display:block}
.fact span{font-size:13px;color:var(--muted)}
.topic{padding-block:28px 8px;border-bottom:1px solid var(--line);display:grid;gap:12px;scroll-margin-top:90px}
.topic .tag{font-size:12px;letter-spacing:.08em;font-weight:500}
.topic.v .tag{color:var(--vision)} .topic.h .tag{color:var(--hearing)} .topic.a .tag{color:var(--accent)}
.topic h3{font-size:21px}
.prose{max-width:68ch}
.prose p{margin:0 0 .6em}
.prose ul,.prose ol{margin:0 0 .6em;padding-left:1.3em}
.prose li{margin:.15em 0}
.prose b{font-weight:700}
.prose .flow{font-size:14px;background:var(--sunk);padding:10px 14px;border-radius:8px}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
figure img{display:block;width:100%;height:auto;cursor:zoom-in;background:#fff}
figure figcaption{font-size:12px;color:var(--muted);padding:6px 10px}
table.mini{border-collapse:collapse;font-size:14px;width:100%}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.mini th{background:var(--sunk);font-weight:500}
.tbl{overflow-x:auto}
.amsler{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.amsler svg{width:220px;max-width:100%;height:auto;background:var(--surface);border:1px solid var(--line)}
.amsler .prose{flex:1 1 240px}

/* form */
.form{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:22px 80px}
.rail{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:6px}
.unit-btn{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;text-align:left;border:1px solid transparent;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.unit-btn:hover{background:var(--sunk)}
.unit-btn[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.unit-btn .k{grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;background:var(--sunk);color:var(--muted)}
.unit-btn[data-dom="v"] .k{background:var(--vision-soft);color:var(--vision)}
.unit-btn[data-dom="h"] .k{background:var(--hearing-soft);color:var(--hearing)}
.unit-btn .t{font-weight:500;font-size:14px}
.unit-btn .c{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.unit-btn.done .c{color:var(--ok)}
.rail .opt{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:10px;padding:0 10px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;gap:4px;margin-bottom:18px}
.case b{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.unit-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin-bottom:6px}
.unit-head h2{font-size:24px}
.unit-head .meta{font-size:13px;color:var(--muted)}
.sec{margin-top:26px}
.sec>h3{font-size:16px;font-family:var(--f-body);font-weight:700;padding-bottom:6px;border-bottom:2px solid var(--line);margin-bottom:12px;display:flex;gap:10px;align-items:baseline}
.sec>h3 span{font-size:12px;color:var(--muted);font-weight:400}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;scroll-margin-top:110px;transition:border-color .2s}
.item.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.item .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.item.ok .dot{background:var(--ok);border-color:var(--ok)}
.item.ok .dot::after{content:"";width:8px;height:4px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.item .body{display:grid;gap:8px;min-width:0}
.item .lbl{font-weight:500}
.item .lbl em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.hint{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}
.hint ol,.hint ul{margin:0;padding-left:1.3em}
.learnlink{justify-self:start;border:0;background:transparent;color:var(--accent);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea,select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px}
textarea{min-height:76px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;background:var(--paper);font-size:14px}
.choice input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.choice.sq span{border-radius:6px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline input[type=text]{flex:1 1 180px;width:auto}
.quick{display:flex;gap:6px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ear{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;background:var(--paper)}
.ear h5{margin:0;font-size:14px}
.ear .row{display:grid;gap:4px}
.ear .row small{color:var(--muted)}
.res{font-size:13.5px;border-radius:8px;padding:8px 12px;background:var(--sunk)}
.res.ok{background:var(--ok-soft);color:var(--ok)}
.res.bad{background:var(--warn-soft);color:var(--warn)}
.note{border-radius:var(--r);padding:12px 16px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.note.bad{border-color:var(--warn);background:var(--warn-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note>b{display:block;margin-bottom:2px}
.note ol{margin:4px 0 0;padding-left:1.3em}
.icope{display:grid;gap:10px}
.icope .grp{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.icope .grp>b{font-size:13px;letter-spacing:.06em}
.icope .grp.bad>b{color:var(--warn)} .icope .grp.ok>b{color:var(--ok)}
.icope .r{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
@media (max-width:520px){.icope .r{grid-template-columns:1fr}}
.tree-img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.unit-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.unit-foot .grow{display:flex;gap:8px;flex-wrap:wrap}
.nextfab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mob-units{display:none}

/* drawer + modal + lightbox */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:41;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,calc(env(safe-area-inset-right,0px) + 20px)) calc(env(safe-area-inset-bottom,0px) + 30px) 20px;box-shadow:-6px 0 24px rgba(0,0,0,.2)}
.drawer .close{position:sticky;top:0;float:right}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:12px;z-index:41;padding:20px 22px;display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{font-size:19px}
.modal label.row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.msg{font-size:13.5px;color:var(--muted)}
.msg.bad{color:var(--warn)} .msg.ok{color:var(--ok)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,10,12,.88);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;z-index:60;font-size:14px}

#report{position:fixed;left:-12000px;top:0;width:760px}

@media (max-width:900px){
  .learn,.form{grid-template-columns:minmax(0,1fr)}
  .toc,.rail{display:none}
  .mob-units{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .mob-units .unit-btn{flex:0 0 auto;grid-template-columns:24px auto;background:var(--surface);border-color:var(--line)}
  .mob-units .unit-btn .k{width:24px;height:24px;font-size:12px}
  .mob-units .unit-btn[aria-current="true"]{border-color:var(--accent)}
  .item{grid-template-columns:1fr}
  .item .no{flex-direction:row;align-items:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* report (PDF) - fixed light print palette */
.rp{font-family:var(--f-body);color:#111;background:#fff;font-size:13px;line-height:1.6;padding:0}
.rp-block{background:#fff;padding:4px 0}
.rp h1{font-family:var(--f-display);font-size:20px;text-align:center;margin:0 0 2px}
.rp .sub{text-align:center;font-size:12px;color:#444;margin-bottom:8px}
.rp h2{font-family:var(--f-display);font-size:16px;margin:6px 0 4px;padding:4px 8px;background:#E8EEEE;border-left:4px solid #0E6767}
.rp h2.v{border-left-color:#A84C0A} .rp h2.h{border-left-color:#2A5BA6}
.rp table{width:100%;border-collapse:collapse;table-layout:fixed}
.rp td,.rp th{border:1px solid #888;padding:5px 7px;vertical-align:top;word-break:break-word;white-space:pre-wrap}
.rp th{background:#F1F4F4;font-weight:700;text-align:left}
.rp td.k{width:30%;background:#FAFBFB}
.rp .empty{color:#999}
.rp .sect{font-weight:700;background:#F1F4F4}
.rp img{max-width:100%;max-height:420px}
</style>
<style>
.score{font-family:var(--f-mono);font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:8px;white-space:nowrap}
.item.ok .score{background:var(--accent-soft);color:var(--accent)}
.choices.stack{flex-direction:column;align-items:stretch}
.choices.stack .choice span{border-radius:8px;display:block}
.tally{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:120px}
.tally b{font-family:var(--f-mono);font-size:20px;display:block;line-height:1.3}
.tally span{font-size:12px;color:var(--muted)}
.dd{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dd input[type=number]{width:96px}
.dd label{display:flex;gap:6px;align-items:center;font-size:14px}
details.quiz{background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px}
details.quiz summary{cursor:pointer;color:var(--accent)}
.sticky-score{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:5;margin-top:10px}
/* 情境實作 */
.guide{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:22px 80px}
.steps{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 110px);overflow-y:auto;font-size:13.5px}
.steps h4{margin:12px 0 2px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500;padding:0 8px}
.stepbtn{display:flex;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
.stepbtn:hover{background:var(--sunk)}
.stepbtn[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.stepbtn i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.stepbtn.done i{background:var(--ok);border-color:var(--ok)}
.stepbtn.wrong i{background:var(--warn);border-color:var(--warn)}
.mode-pill{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.mode-pill.on{background:var(--ok-soft);color:var(--ok)}
.story{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:16px 20px;margin:12px 0 16px;font-size:15.5px;line-height:1.85}
.story p{margin:0 0 .7em}.story p:last-child{margin:0}
.story .say{color:var(--accent);font-weight:500}
.story .tip{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}
.fb{border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.7}
.fb.right{background:var(--ok-soft);color:var(--ok)}
.fb.wrong{background:var(--warn-soft);color:var(--warn)}
.fb.ref{background:var(--accent-soft);color:var(--ink)}
.fb b{display:block}
.fb .why{color:var(--ink);margin-top:2px}
.fb .disc{margin-top:6px;font-size:13px;color:var(--ink)}
.sc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:10px}
.gnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
@media (max-width:900px){.guide{grid-template-columns:minmax(0,1fr)}.steps{display:none}}
/* 情境對話 */
.chatlayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding-block:18px 80px;align-items:start}
.chatpane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);height:calc(100vh - 104px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chathead{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.chathead b{font-family:var(--f-display);font-size:17px}
.chatlog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.cm{max-width:86%;display:grid;gap:2px}
.cm small{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.cm>div{padding:8px 12px;border-radius:12px;line-height:1.65;font-size:15px;white-space:pre-wrap}
.cm.me{align-self:flex-end;text-align:left}.cm.me small{text-align:right}
.cm.me>div{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.cm.e>div{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.cm.e small{color:var(--vision)}
.cm.d>div{background:var(--hearing-soft);border-bottom-left-radius:4px}
.cm.d small{color:var(--hearing)}
.cm.obs{max-width:100%;align-self:stretch;font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px;display:block;line-height:1.7}
.cm.obs span{font-size:11.5px;font-weight:700;letter-spacing:.06em;margin-right:8px;color:var(--ink)}
.cm.sys{max-width:100%;align-self:stretch;font-size:13px;color:var(--accent);text-align:center;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.chip{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.chatin textarea{min-height:44px;resize:none;flex:1}
.chatfoot{display:flex;justify-content:space-between;padding:0 8px 6px;background:var(--surface)}
.panel{min-width:0}
.punit{margin-bottom:18px}
.ph{font-size:18px;padding:6px 10px;border-radius:8px;background:var(--sunk);margin-bottom:4px}
.ph.v{box-shadow:inset 4px 0 0 var(--vision)}.ph.h{box-shadow:inset 4px 0 0 var(--hearing)}.ph.a{box-shadow:inset 4px 0 0 var(--accent)}
.panel .sec{margin-top:12px}
.item.locked{opacity:.6;background:transparent;border-style:dashed;padding-block:8px}
.item.locked .lbl{font-weight:400}
@media (max-width:900px){.chatlayout{grid-template-columns:minmax(0,1fr)}.chatpane{position:relative;top:0;height:70vh}}
</style>
</head>

<script>
"use strict";
/* ============ 各項評分定義（取自課堂簡報） ============ */
const H = {
 b1:`<ol><li><b>可自行維持坐姿平衡，移至椅子或用輪椅</b>：可獨立完成整個移位過程，包括自行維持坐姿平衡、由床移至椅子或輪椅、使用輪椅的煞車和移動腳踏板，都不需他人協助、監督或持續敦促，且沒有安全上顧慮。</li><li><b>移位時需少部分協助或提醒</b>：需少許協助或提醒方能完成；或移位過程有安全上顧慮，需有人在旁監督或持續敦促。</li><li><b>可自行維持坐姿平衡，離床需大部分協助</b>：能自行維持坐姿平衡，但移位過程需他人大部分協助。</li><li><b>需完全協助（完全依賴）</b>：完全需他人協助才能維持坐姿平衡或幫忙移位。</li></ol>`,
 b2:`<ol><li><b>獨立走 50 公尺以上（可用輔具）</b>：可獨立或使用輔具（拐杖、支架、義肢、助行器）行走 50 公尺以上（指一口氣走完），過程無安全顧慮，不需他人協助、監督或持續敦促。</li><li><b>需協助扶持走 50 公尺以上</b>：需他人稍微扶持（一手攙扶）或口頭指導才可行走 50 公尺（一口氣走完或中間需休息一次以內）；或不需扶持但行走時間明顯過長或走不到 50 公尺；或行走時搖擺不定、有跌倒危險。</li><li><b>不能步行 50 公尺，但能操縱輪椅 50 公尺</b>：可獨立操作輪椅（轉彎、進門、接近桌子、床沿等）推行 50 公尺以上；或可行走但需他人大量扶持，且距離在 50 公尺內。</li><li><b>不能步行 50 公尺，且無法操縱輪椅</b>。</li></ol>`,
 b3:`<p>不包含自行準備食物、餐具或盛裝食物等。</p><ol><li><b>在合理時間（一小時）內自行或用輔具進食</b>：不需他人協助、監督或持續敦促，可自行用餐具取用眼前的食物、切割食物、將餐盤內食物吃完；能自行取用穿脫進食輔具。</li><li><b>需要一些協助</b>：需他人幫忙夾菜、切肉、弄碎食物或穿脫輔具；或可自行吃但超過一小時、食物灑落一地；或勉強完成、過程非常辛苦；或需他人提醒飲食量、避免哽噎。</li><li><b>需完全協助</b>：只能嚼動，手不會舀，完全由他人餵食。</li></ol>`,
 b4:`<ol><li><b>可自行上下馬桶、整理衣褲、使用衛生紙、沖馬桶或清理便盆</b>：不弄髒衣物、自行用衛生紙擦拭清潔，不需他人協助、監督或持續敦促；可使用輔具（如馬桶專用起身扶手）；腸造口者可完全自理；插導尿管者可自行清理尿袋。</li><li><b>需協助整理衣物或使用衛生紙，或需協助清理便盆</b>：使用馬桶、便盆時需他人扶持或協助；或可自行完成但需有人監督或持續敦促以確保安全及衛生。</li><li><b>需完全協助</b>：整個過程完全需要他人協助。</li></ol>`,
 b5:`<ol><li><b>安全上下樓梯，可用扶手、拐杖</b>：可自行上下一層樓梯，不需他人扶持、監督或持續敦促，且無安全上顧慮。</li><li><b>需協助、監督或持續敦促</b>：抓扶手、使用拐杖，仍需他人稍微扶持（一手輕扶）、口頭指導、監督或敦促；或只能上樓梯但無法下樓梯。</li><li><b>無法上下樓</b>：需他人大量協助（如一人雙手費力扶持或兩人共同扶持），或完全無法上下樓梯、需他人用背的。</li></ol>`,
 b6:`<ol><li><b>自行穿脫衣褲及鞋襪</b>：包括穿脫衣褲、解開釦子或拉拉鍊、穿脫鞋襪、綁鞋帶及穿脫輔具（義肢、支架），都不需他人協助、監督或持續敦促，每項動作分別於十分鐘內完成；若衣褲鞋襪都沒有釦子或鞋帶（如功夫鞋、魔鬼氈），個案也能自行完成。</li><li><b>需協助</b>：在他人協助下，能在合理時間（十分鐘內）自行完成一半以上的動作；細微動作需他人協助，如拉好襪子、繫鞋帶、扣好釦子。</li><li><b>需完全協助</b>：穿脫過程中至少一半以上需要別人幫忙。</li></ol>`,
 b7:`<ol><li><b>無失禁，或便秘時能自行用塞劑、甘油球</b>：可完全自我控制大便；便秘時可自行使用塞劑、甘油球、腹部按摩或用手指挖大便，不需他人協助、監督或敦促。</li><li><b>偶爾失禁，或便秘時需協助用塞劑</b>：大便失禁每週不超過 1 次；或偶爾（每週 1 次以下）便秘時需他人協助。</li><li><b>需完全協助</b>：大便失禁每週 2 次（含）以上。</li></ol>`,
 b8:`<ol><li><b>無失禁</b>：可完全自我控制，日夜皆不會尿失禁；腹膜透析者可自行處理透析程序。</li><li><b>偶爾失禁</b>：尿失禁或尿急（無法等放好尿壺、便盆或無法即時趕到廁所）每週不超過 1 次；或需他人協助處理腹膜透析。</li><li><b>需完全協助</b>：尿失禁每週 2 次（含）以上，或使用導尿管。</li></ol>`,
 b9:`<ol><li><b>可自行洗臉、洗手、刷牙、梳頭、刮鬍子</b>：不需他人協助、監督或持續敦促，可使用輔具。</li><li><b>需協助</b>：需協助、監督或持續敦促才能完成所有項目；需他人準備用物（牙膏、牙刷、漱口杯）才能完成，也屬需協助。</li></ol>`,
 b10:`<ol><li><b>能自行完成</b>：可自行完成盆浴、淋浴或擦澡，不需他人協助、監督或持續敦促。</li><li><b>協助下完成</b>：需他人協助、監督或持續敦促才能完成；或可自行完成但過程困難、清潔度不佳。</li></ol>`,
 i1:`<p>問法：請問您當需要聯絡他人時，您能不能自己打電話？</p><ul><li>僅能撥熟悉的電話號碼：只能撥少於 5 組的常用電話。</li><li>僅會接電話：只能接聽電話，並聽懂對方所說的內容。</li></ul><p><b>聽覺障礙者</b>：此題評估與外界溝通（聯絡）的能力，若會使用傳真機、通訊軟體、具視頻字幕擴音功能電話機或其他溝通媒介，可視為有此能力。</p>`,
 i2:`<p>問法：請問您能不能自己一個人購物（買東西）？</p><p>評估個案是否有購物的能力，以及購買的複雜程度；<b>使用何種交通工具去購物不是本題評估範圍</b>。</p><ul><li>獨立購買日常生活用品：僅能在附近商店購買簡單日常必需品（如便當、衛生紙），較複雜的品項需要有人陪。</li><li>每一次上街購物都需要有人陪：只要有人陪伴就可以完成購物。</li><li>完全不會上街購物：因身體、精神或智能因素完全不能購物，例如長期臥床、昏迷或心智功能障礙者。</li></ul>`,
 i3:`<p>問法：請問您能不能自己一個人準備餐食？包括備食材及佐料、清洗、煮食、配菜、食具擺設，各式工具及方法皆可使用。</p><ul><li>如果準備好一切佐料會做一頓飯菜：備餐完成後不會遺漏需使用的主要食材。</li><li>會將已做好的飯菜加熱：可正確使用電器用品（電鍋、微波爐等）加熱。</li></ul><p><b>評估技巧</b>：若個案平時不需自己煮，可問「如果家人都不在家或商家都沒有營業（如過年）時，您能不能自己加熱飯菜？或自己煮一頓飯菜？」</p>`,
 i4:`<p>問法：請問您能不能自己一個人做家事？（整理房間、掃地、拖地、洗碗、擦桌子；清潔程度如何？需要別人幫忙看碗是否洗乾淨嗎？）</p><ul><li><b>獨居個案</b>：以自己住所之家務清潔整理為範圍。</li><li><b>非獨居個案</b>：以個案活動區域為範圍，如房間和客廳之整理，以及飲食用餐具的洗滌。</li></ul>`,
 i5:`<p>問法：請問您能不能自己一個人洗衣服（含晾曬衣服）？<b>洗衣和晾曬兩者皆能自行完成，才算獨立完成</b>。</p><ul><li>原本沒有洗衣習慣：問「若家人不在家，必須自己洗衣時，能不能自己清洗小件衣物或所有衣物？」</li><li>使用洗衣機：是否會把衣服丟進洗衣機、倒入適量清潔劑並按鈕開始清洗。</li><li>機構住民：看的是能力，而非環境的限制和機構的制度。</li></ul>`,
 i6:`<p>問法：請問您能不能自己一個人外出活動？</p><p>評估個案在<b>無人陪同</b>下，能否使用交通工具（不限種類）獨立外出到較遠的地方（不是只到住家附近公園散步），且安全到達目的地並安全回來。</p><ul><li>搭乘大眾運輸工具需要較高的能力：規劃路線、知道到哪裡搭車、哪一站下車、到站後如何走到目的地。</li><li>搭乘計程車需要的能力較低：路邊招車或電話叫車即可到目的地。</li></ul>`,
 i7:`<p>問法：請問您能不能自己一個人服用藥物？</p><ul><li>需要提醒或少許協助／事先準備好份量可自行服用：有時會忘記吃藥，需提醒時間或份量，或需他人準備好份量、依時間排好放進藥盒、在藥包上做記號，個案再自行服用。</li><li>不能自己服用藥物：包含亂吃、拒吃、藏藥、無法自行服藥。</li></ul><p><b>評估技巧</b>：若個案目前不用吃藥，詢問感冒時可否自行依照時間服用藥物。</p>`,
 i8:`<p>問法：請問您能不能自己一個人處理財務？</p><ul><li>可以獨立處理財務：到郵局（銀行）提存款、支付房租、帳單、給錢、找錢等。</li><li>可以處理日常的購買：只能處理日常購買（給錢、找錢），無法處理與銀行往來或金額較大的財務往來。</li></ul>`,
};

/* ============ 教材 ============ */
const T_ = (id,dom,group,title,imgs,html,extra)=>Object.assign({id,dom,group,title,imgs,html},extra||{});
const TOPICS = [
 T_("c-aging","a","基本概念","人口老化、失能與長照",[["a2","人口老化，衰弱與失能人口逐年增加"],["a3","長期照顧服務法"]],`
  <p>依國發會（2025）推估，長者中約 <b>17.5%</b> 有衰弱風險、<b>12.7%</b> 失能。</p>
  <p><b>長期照顧服務法第三條</b></p>
  <ul><li><b>身心失能者</b>：指身體或心智功能部分或全部喪失，致其日常生活需他人協助者。</li>
  <li><b>長期照顧</b>：指身心失能持續已達或預期達 <b>＿＿</b> 個月以上者，依其個人或其照顧者之需要，所提供之生活支持、協助、社會參與、照顧及相關之醫護服務。</li></ul>
  <details class="quiz"><summary>想一想：空格是幾個月？（點開看答案）</summary>6 個月。</details>`),
 T_("c-levels","a","基本概念","生活功能評估的三個層次",[["a4","生活功能評估的三個層次"],["a5","退化的歷程"],["a6","功能發展與退化的階層順序"]],`
  <ul><li><b>基本日常生活活動功能（BADL／ADL）</b>：評估個人日常生活的自我照顧能力。常用工具：Katz ADL、巴氏量表（Barthel Index）。</li>
  <li><b>工具性日常生活活動功能（IADL）</b>：評估個人於社區獨立生活的能力，常用 Lawton IADL 量表。</li>
  <li><b>高階性日常生活活動功能（AADL）</b>：完成社會角色的能力，內容尚無共識，如複雜休閒活動、終身學習、志願服務、使用現代科技（網路銀行、遠距醫療）。</li></ul>
  <p><b>退化的歷程不是一次全部失去，而是由複雜到基本</b>：社交參與（AADL）→ 獨立生活（IADL）→ 基本生活自理（ADL）。</p>
  <p class="flow">功能階層（Katz &amp; Akpom, 1976）：進食 → 排便控制 → 移動 → 如廁 → 穿衣 → 洗澡。進食是最基本、最早習得的能力，在老化過程中保留最久；洗澡則最早喪失獨立性。</p>`),
 T_("c-cms","a","基本概念","照顧管理評估量表（129 題）",[["a8","照顧管理評估量表 A–F"],["a9","照顧管理評估量表 G–K"],["a10","E 大題 ADLs 與 F 大題 IADLs"]],`
  <p>長照 2.0 由照顧管理專員以「照顧管理評估量表」評估失能等級，共 129 題：</p>
  <div class="tbl"><table class="mini"><tr><th>大題</th><th>內容</th></tr>
  <tr><td>A 基本資料表（8）</td><td>婚姻狀況、教育程度、身分別、年齡</td></tr>
  <tr><td>B 主要及次要照顧者（8）</td><td>是否有主要照顧者、性別、年齡、次要照顧者與個案關係</td></tr>
  <tr><td>C 溝通能力（6）</td><td>意識狀態、視力、聽力、表達及理解能力</td></tr>
  <tr><td>D 短期記憶（5）</td><td>重複三個詞：襪子、藍色、床</td></tr>

UNITS.forEach(u=>{let n=0;u.secs.forEach(s=>s.items.forEach(it=>{it.unit=u.id;if(it.type!=="note"){n++;it.no=u.key+"-"+n;}}));});
const ALL = UNITS.flatMap(u=>u.secs.flatMap(s=>s.items));
const BY = Object.fromEntries(ALL.map(i=>[i.id,i]));

/* ============ 計分與判讀 ============ */
function scoreOf(i,v){ if(!v) return null;
  if(i.score==="paren"){const m=v.match(/\((\d+)\)\s*$/);return m?+m[1]:null;}
  if(i.score==="lead"){const m=v.match(/^(\d)/);return m?+m[1]:null;}
  if(i.score==="yn") return v.startsWith("是")?1:0;
  return null;}
const maxOf=i=>Math.max(...i.opts.map(o=>scoreOf(i,o)));
const BIDS=["b1","b2","b3","b4","b5","b6","b7","b8","b9","b10"];
const IIDS=["i1","i2","i3","i4","i5","i6","i7","i8"];
function sumOf(ids){let t=0,n=0;ids.forEach(id=>{const s=scoreOf(BY[id],S[id]);if(s!==null){t+=s;n++;}});return [t,n];}
function barthelLevel(t){return t===100?"完全獨立（100）":t>=91?"輕度依賴（91–99）":t>=61?"中度依賴（61–90）":t>=21?"嚴重依賴（21–60）":"完全依賴（0–20）";}
function barthelNeedHelp(S){return BIDS.some(id=>{const s=scoreOf(BY[id],S[id]);return s!==null&&s<maxOf(BY[id]);});}
function barthelNote(S){const [t,n]=sumOf(BIDS);
  const dep=BIDS.filter(id=>{const s=scoreOf(BY[id],S[id]);return s!==null&&s<maxOf(BY[id]);}).map(id=>BY[id].label.replace(/^\d+\.\s*/,""));
  const tally=`<div class="tally"><div><b>${t}</b><span>總分（已填 ${n}/10 項）</span></div>${n===10?`<div><b style="font-size:16px">${barthelLevel(t)}</b><span>說明（依總分）</span></div>`:""}</div>`;
  const kind=n<10?"info":t===100?"ok":"bad";
  return [kind,"巴氏量表總分",tally+(n<10?"評估單註明「不可空白」，請完成全部 10 項。":"")+(dep.length?`需協助項目：${dep.join("、")}`:"")];}
function sofNote(S){const ids=["s1","s2","s3"];const [t,n]=sumOf(ids);if(!n)return null;
  const lv=t>=2?"衰弱":t===1?"衰弱前期":"健壯";
  return [n<3?"info":t>=2?"bad":t===1?"info":"ok","SOF 總分："+t+" 分"+(n<3?`（已填 ${n}/3）`:""),n<3?"請完成三題。":`判讀參考：${lv}（0 分健壯、1 分衰弱前期、≥2 分衰弱）。`];}
const HELP5={i1:1,i2:1,i3:1,i4:1,i5:1};
function iadlHelp(S){return Object.keys(HELP5).filter(id=>{const s=scoreOf(BY[id],S[id]);return s!==null&&s<maxOf(BY[id]);});}
function iadlNote(S){const [t,n]=sumOf(IIDS);if(!n)return null;
  const h=iadlHelp(S),names=h.map(id=>BY[id].label);
  const done5=Object.keys(HELP5).every(id=>S[id]);
  let msg=`<div class="tally"><div><b>${t} / 24</b><span>IADL 總分（已填 ${n}/8 項）</span></div><div><b>${h.length} / 5</b><span>五項中需協助項目</span></div></div>`;
  if(names.length)msg+="需協助："+names.join("、")+"。";
  if(done5)msg+=h.length>=3?"<br><b>五項中有三項以上需要協助，符合輕度失能。</b>":"<br>五項中需協助未達三項，未達輕度失能。";
  msg+=`<br><span style="font-size:12.5px;opacity:.8">「需協助」判定：該項未達最高分（未能完全獨立）。</span>`;
  return [h.length>=3?"bad":"info","IADL 計分",msg];}
const daysOn=v=>!!v&&!v.none&&+v.d>0;
function mins(v){if(!v||v.unk)return null;const h=+(v.h||0),m=+(v.m||0);if(!v.h&&!v.m)return null;return Math.min(180,h*60+m);}
function ipaq(S){const part=(d,t,met)=>{if(!S[d])return null;if(!daysOn(S[d]))return {days:0,min:0,met:0};const mm=mins(S[t]);if(mm===null)return {days:+S[d].d,min:null,met:null};return {days:+S[d].d,min:mm,met:met*mm*(+S[d].d)};};
  const V=part("pv_d","pv_t",8),M=part("pm_d","pm_t",4),W=part("pw_d","pw_t",3.3);
  if(!V||!M||!W||V.met===null||M.met===null||W.met===null) return null;
  const tot=V.met+M.met+W.met, days=V.days+M.days+W.days;
  let lv="低度";
  if((V.days>=3&&V.met>=1500)||(days>=7&&tot>=3000)) lv="高度";
  else if((V.days>=3&&V.min>=20)||(M.days+W.days>=5&&(Math.max(M.min,W.min)>=30))||(days>=5&&tot>=600)) lv="中度";
  return {V,M,W,tot,lv};}
function ipaqNote(S){const r=ipaq(S);const sit=mins(S.ps_t);
  if(!r) return ["info","身體活動量","完成二～四題後，這裡會計算每週 MET-分鐘與活動量等級（依 IPAQ 計分原則，供參考）。"];
  return ["info","身體活動量（判讀參考）",`<div class="tally"><div><b>${(Math.round(r.tot*10)/10).toLocaleString()}</b><span>MET-分鐘／週</span></div><div><b style="font-size:16px">${r.lv}身體活動量</b><span>等級</span></div>${sit!==null?`<div><b>${(S.ps_t.h||0)}時${(S.ps_t.m||0)}分</b><span>工作天每日坐著</span></div>`:""}</div>費力 ${Math.round(r.V.met)}・中等 ${Math.round(r.M.met)}・走路 ${Math.round(r.W.met)} MET-分鐘／週。`];}
function overall(S){const rows=[];
  const [bt,bn]=sumOf(BIDS);if(bn)rows.push(`巴氏量表：${bt} 分${bn===10?"，"+barthelLevel(bt):`（已填 ${bn}/10）`}${S.b_final?"；最後級分："+S.b_final:""}`);
  const dep=BIDS.filter(id=>{const s=scoreOf(BY[id],S[id]);return s!==null&&s<maxOf(BY[id]);}).map(id=>BY[id].label.replace(/^\d+\.\s*/,""));if(dep.length)rows.push("ADL 需協助：" + dep.join("、"));
  const [st,sn]=sumOf(["s1","s2","s3"]);if(sn===3)rows.push(`SOF 衰弱評估：${st} 分（${st>=2?"衰弱":st===1?"衰弱前期":"健壯"}）`);
  const [it,inn]=sumOf(IIDS);if(inn){const h=iadlHelp(S);rows.push(`IADL：${it}/24 分；五項中需協助 ${h.length} 項${h.length>=3?"，符合輕度失能":""}`);}
  const r=ipaq(S);if(r)rows.push(`IPAQ：${(Math.round(r.tot*10)/10).toLocaleString()} MET-分鐘／週，${r.lv}身體活動量`);
  if(!rows.length) return ["info","評估結果整理","完成前面各單元後，這裡會整理 ADL、衰弱、IADL 與活動量結果，幫你撰寫健康問題與建議。"];
  return ["info","評估結果整理","<ol>"+rows.map(x=>"<li>"+x+"</li>").join("")+"</ol>"];}

const vis=i=>!i.show||i.show(S);
function answered(i){const v=S[i.id];
  switch(i.type){
    case "note":return true;
    case "checks":return Array.isArray(v)&&v.length>0;
    case "checklist":return Array.isArray(v)&&v.length===i.opts.length;
    case "family":return !!(v&&String(v).trim())||!!S.tree_img;
    case "radio":return !!v&&(!i.other||v!==i.other||!!(S[i.id+"_o"]||"").trim());
    case "days":return !!v&&(v.none||(v.d!==undefined&&v.d!==""));
    case "dur":return !!v&&(v.unk||!!v.h||!!v.m);
    default:return v!==undefined&&String(v).trim()!=="";
  }}
const countable=i=>i.type!=="note"&&!i.opt&&vis(i);
function unitStat(u){const its=u.secs.flatMap(s=>s.items).filter(countable);return [its.filter(answered).length,its.length];}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}

function inputHTML(i){const v=S[i.id];const name=i.id;
  switch(i.type){
   case "text":return `<input type="text" id="f-${name}" data-k="${name}" value="${esc(v)}">`;
   case "number":return `<input type="number" id="f-${name}" data-k="${name}" value="${esc(v)}" min="0" max="130" style="max-width:160px">`;
   case "date":case "datetime-local":return `<input type="${i.type}" id="f-${name}" data-k="${name}" value="${esc(v)}" style="max-width:260px">`;
   case "textarea":return `<textarea id="f-${name}" data-k="${name}" rows="${i.rows||3}">${esc(v)}</textarea>${i.caseBtn?`<div class="inline"><button type="button" class="btn small" id="use-case">帶入課堂案例（張非）</button></div>`:""}`;
   case "radio":return `<div class="choices${i.stack?" stack":""}" role="radiogroup">${i.opts.map((o,k)=>`<label class="choice"><input type="radio" name="r-${name}" id="f-${name}-${k}" data-k="${name}" value="${esc(o)}" ${v===o?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div>${i.other?`<input type="text" id="f-${name}_o" data-k="${name}_o" value="${esc(S[name+"_o"])}" placeholder="其他（請說明）" ${v===i.other?"":"hidden"}>`:""}${i.withNote?`<input type="text" id="f-${name}_n" data-k="${name}_n" value="${esc(S[name+"_n"])}" placeholder="${esc(i.notePh||"補充說明（選填）")}">`:""}`;
   case "checks":case "checklist":{const a=Array.isArray(v)?v:[];return `<div class="choices">${i.opts.map((o,k)=>`<label class="choice sq"><input type="checkbox" id="f-${name}-${k}" data-k="${name}" value="${esc(o)}" ${a.includes(o)?"checked":""}><span>${i.type==="checklist"?"✓ ":""}${esc(o)}</span></label>`).join("")}</div>`;}
   case "family":return `<textarea id="f-${name}" data-k="${name}" rows="4" placeholder="例：個案為長子，配偶同住；育有一子一女，長女住台中……">${esc(v)}</textarea>
     <div class="inline"><label class="btn small" for="f-tree-file">上傳手繪家族樹照片</label><input type="file" id="f-tree-file" accept="image/*" hidden>${S.tree_img?`<button type="button" class="btn small ghost" id="tree-del">移除照片</button>`:""}</div>
     ${S.tree_img?`<img class="tree-img" src="${S.tree_img}" alt="家族樹照片">`:""}`;
   case "days":{const o=v||{};return `<div class="dd"><label><input type="number" min="0" max="7" step="1" id="f-${name}-d" data-obj="${name}" data-f="d" value="${esc(o.d)}" ${o.none?"disabled":""}> 天</label><label class="choice sq"><input type="checkbox" id="f-${name}-none" data-obj="${name}" data-f="none" ${o.none?"checked":""}><span>${esc(i.none)}</span></label></div>`;}
   case "dur":{const o=v||{};return `<div class="dd"><label>一天 <input type="number" min="0" max="24" id="f-${name}-h" data-obj="${name}" data-f="h" value="${esc(o.h)}" ${o.unk?"disabled":""}> 小時</label><label><input type="number" min="0" max="59" id="f-${name}-m" data-obj="${name}" data-f="m" value="${esc(o.m)}" ${o.unk?"disabled":""}> 分鐘</label>${i.nounk?"":`<label class="choice sq"><input type="checkbox" id="f-${name}-unk" data-obj="${name}" data-f="unk" ${o.unk?"checked":""}><span>不知道／不確定</span></label>`}</div>`;}
  }}

   <div class="body"><div class="lbl">${esc(i.label)}${i.score&&i.score!=="yn"?`<span class="score" data-score="${i.id}"></span>`:""}${i.em?`<em>${esc(i.em)}</em>`:""}${i.opt&&!i.em?`<em>選填</em>`:""}</div>

function railHTML(){return UNITS.map(u=>{const [a,b]=unitStat(u);return `<button type="button" class="unit-btn ${a===b?"done":""}" data-unit="${u.id}" data-dom="${u.dom}" aria-current="${UI.unit===u.id}"><span class="k">${u.key}</span><span class="t">${u.title}</span><span class="c">${a}/${b}${a===b?" 完成":""}</span></button>`;}).join("");}

function refresh(){
  const u=UNITS.find(x=>x.id===UI.unit);
  ALL.forEach(i=>{
    if(i.type==="note"){const slot=$(`[data-note="${i.id}"]`);if(!slot)return;const r=i.fn(S);slot.innerHTML=r?`<div class="note ${r[0]}"><b>${r[1]}</b>${r[2]}</div>`:"";return;}
    const el=$("#it-"+i.id);if(!el)return;el.hidden=!vis(i);el.classList.toggle("ok",answered(i));
    if(i.other){const o=$("#f-"+i.id+"_o");if(o)o.hidden=S[i.id]!==i.other;}
    const sc=$(`[data-score="${i.id}"]`);if(sc){const s=scoreOf(i,S[i.id]);sc.textContent=(s===null?"—":s)+" / "+maxOf(i)+" 分";}
    if(i.type==="days"){const o=S[i.id]||{};const d=$(`#f-${i.id}-d`);if(d)d.disabled=!!o.none;}
    if(i.type==="dur"){const o=S[i.id]||{};["h","m"].forEach(f=>{const x=$(`#f-${i.id}-${f}`);if(x)x.disabled=!!o.unk;});}
  });
  let A=0,B=0;UNITS.forEach(x=>{const [p,q]=unitStat(x);A+=p;B+=q;});$("#prog").style.width=(B?A/B*100:0)+"%";
  if(UI.mode==="guide"){refreshGuide();return;}
  if(!$("#unit-meta"))return;
  const [a,b]=unitStat(u);$("#unit-meta").textContent=`已完成 ${a} / ${b} 項`;
  $("#rail").innerHTML=railHTML();$("#mrail").innerHTML=railHTML();
  const ct=$("#case-text");ct.textContent=S.scenario||"尚未填寫。請在 A 單元寫下你們組擬定的受評者角色與情境，或帶入課堂案例（張非）。";ct.style.color=S.scenario?"":"var(--muted)";ct.style.whiteSpace="pre-line";
}
function nextOpen(fromId){
  const u=UNITS.find(x=>x.id===UI.unit);const its=u.secs.flatMap(s=>s.items).filter(countable);
  const start=fromId?its.findIndex(i=>i.id===fromId)+1:0;
  return [...its.slice(start),...its.slice(0,start)].find(i=>!answered(i));
}
function focusItem(i){const el=$("#it-"+i.id);if(!el)return;$$(".item.focus").forEach(x=>x.classList.remove("focus"));el.classList.add("focus");el.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>el.classList.remove("focus"),1600);}
function derive(k){
  if((k==="birth"||k==="datetime")&&S.birth){const ref=S.datetime?new Date(S.datetime):new Date(),b=new Date(S.birth);if(!isNaN(b)){let a=ref.getFullYear()-b.getFullYear();const m=ref.getMonth()-b.getMonth();if(m<0||(m===0&&ref.getDate()<b.getDate()))a--;if(a>=0&&a<130){S.age=String(a);const f=$("#f-age");if(f)f.value=a;}}}
}
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.k){const k=t.dataset.k,i=BY[k];
    if(t.type==="checkbox"){const a=Array.isArray(S[k])?S[k]:[];S[k]=t.checked?[...new Set([...a,t.value])]:a.filter(x=>x!==t.value);}
    else S[k]=t.value;
    derive(k);save();refresh();
    if(UI.auto&&t.type==="radio"&&i&&answered(i)){const n=UI.mode==="guide"?nextOpenGuide(k):nextOpen(k);if(n)setTimeout(()=>focusItem(n),UI.mode==="guide"&&G.practice?900:260);}
  }
  if(t.dataset.obj){const k=t.dataset.obj,f=t.dataset.f;const o={...(S[k]||{})};
    if(t.type==="checkbox"){o[f]=t.checked;}else{let val=t.value;if(f==="d"&&val!==""){val=String(Math.max(0,Math.min(7,Math.round(+val))));}o[f]=val;}
    if(f==="d"&&o.d==="0"){o.none=true;o.d="";const cb=$(`#f-${k}-none`);if(cb)cb.checked=true;t.value="";}
    S[k]=o;save();refresh();
    if(UI.auto&&t.type==="checkbox"&&t.checked){const n=UI.mode==="guide"?nextOpenGuide(k):nextOpen(k);if(n)setTimeout(()=>focusItem(n),260);}
  }
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="opt-auto"){UI.auto=t.checked;saveUI();}
  if(t.id==="f-tree-file"&&t.files[0]){try{S.tree_img=await shrink(t.files[0],1400);save();renderForm();toast("已加入家族樹照片");}catch(err){toast("無法讀取這張圖片，請改用 JPG 或 PNG");}}
  if(t.id==="f-import"&&t.files[0]){try{const d=JSON.parse(await t.files[0].text());if(typeof d!=="object"||!d)throw 0;S=d;save();renderForm();toast("已載入作答檔");}catch(err){toast("檔案格式不正確，請選擇先前下載的作答檔（.json）");}closeModal();}
});
function shrink(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82));};im.src=r.result;};r.readAsDataURL(file);});}

  if(t.id==="use-case"){S.scenario=CASE_ZHANG;if(!S.client)S.client="張非";if(!S.sex)S.sex="生理男";if(!S.age)S.age="80";if(!S.marital)S.marital="已婚";if(!S.edu)S.edu="國小";if(!S.cg){S.cg="有";S.cg_sex="生理女";S.cg_rel="妻子";}save();renderForm();toast("已帶入張非案例");return;}
  if(t.id==="tree-del"){delete S.tree_img;save();renderForm();return;}

 {g:"建議",title:"健康問題評估及建議",text:P("綜合 ADL、衰弱、IADL、身體活動與居家環境，寫下阿嬤的主要健康問題與照護建議。"),
  items:["g_sum","g_problem","g_advice"],
  key:{g_problem:{ref:"1. 衰弱，合併肌力與耐力下降，有肌少症風險（呼應營養評估的小腿圍 30 公分、MNA 15 分）。\n2. 跌倒高風險：夜尿、走廊沒有夜燈、浴室門檻高、沒有扶手、床太低、下肢無力，加上上個月已有一次差點跌倒。\n3. ADL 中度依賴、IADL 失能，身體活動量低、久坐。\n4. 夜間偶發尿失禁。\n5. 社會參與減少，不想麻煩家人。"},
   g_advice:{ref:"居家環境：走廊和臥室加裝感應式夜燈；浴室門檻加斜坡或移除，馬桶旁和淋浴區加裝扶手、鋪止滑墊；塑膠板凳換成有靠背的洗澡椅；床墊墊高或改用可調高度的床；可申請長照居家無障礙環境改善與輔具補助。\n輔具：夜間床邊放便盆椅；穿襪輔助器、長柄鞋拔；外出可評估助行器或輪椅。\n運動與活動：轉介物理治療，做漸進式下肢肌力與平衡訓練（扶椅坐站、踮腳、側抬腿）；每天分次走動，逐步增加到每次連續 10 分鐘，減少久坐；搭配營養師建議的高蛋白飲食。\n失禁與夜尿：白天補足水分、傍晚後減量、睡前排尿；泌尿道感染後新發失禁建議回診；教導骨盆底肌運動。\n長照與社會資源：申請長照 2.0 評估，使用居家服務（協助洗澡）、交通接送、日間照顧；由家人或交通車陪同逐步恢復據點共餐；藥盒持續由媳婦分裝，請藥師提供大字藥袋。\n照顧者支持：媳婦負荷大，評估照顧負荷，介紹喘息服務與家庭照顧者支持據點。"}}},

const IN=Object.fromEntries(INTENTS.map(t=>[t.id,t]));
const START_UNLOCK=["scenario","group","datetime","assessor","sex","prep_steps","respondent","prep_note","g_problem","g_advice"];
const NO_ASK=new Set(["scenario","group","datetime","assessor","prep_steps","respondent","prep_note","g_problem","g_advice","b_final","i_mean","sex"]);
const MISS=[[E_,"蛤？你說什麼？大聲一點、慢一點啦，我左耳聽不太到。"],[E_,"這個我聽不太懂耶，你可以換個方式問嗎？"],[D_,"你是想問她哪一方面？吃飯、走路、洗澡、上廁所，還是買東西、出門、吃藥這些？"]];
const norm=s=>s.replace(/[\s，。、？?！!「」『』：:；;,.（）()…~～]/g,"");
function matchQ(q){const s=norm(q);const out=[];
  INTENTS.forEach(t=>{if(t.x&&new RegExp(t.x).test(s))return;let sc=0;
    if(t.kk)(Array.isArray(t.kk)?t.kk:t.kk.split("|")).forEach(w=>{if(new RegExp(w,"i").test(s))sc+=3;});
    if(t.k)t.k.split("|").forEach(w=>{if(new RegExp(w,"i").test(s))sc+=1;});
    if(sc>0)out.push([t,sc]);});
  out.sort((a,b)=>b[1]-a[1]);if(!out.length)return [];
  const top=out[0][1];
  /* 主要話題，加上其他分數也很高（≥3）的話題，最多 3 個 */
  const pick=out.filter(([t,sc],n)=>n===0||(sc>=3&&sc>=top-1)).slice(0,3).map(x=>x[0]);
  /* 一般寒暄只在沒有其他話題時回應 */
  const real=pick.filter(t=>t.id!=="greet"&&t.id!=="explain");
  return real.length?real:pick.slice(0,1);}

let G={practice:false,list:false,reveal:{}};
const KEYS=()=>{const sc=curSc();const k={};if(sc)sc.steps.forEach(st=>Object.assign(k,st.key||{}));return k;};
function guideMode(){return location.hash.slice(1)==="practice";}
function curSc(){return SCENARIOS.find(x=>x.id===S.scenarioId)||null;}
function unlocked(){const u=new Set(START_UNLOCK);(S.asked||[]).forEach(id=>(IN[id]&&IN[id].unlock||[]).forEach(x=>u.add(x)));
  if(BIDS.every(id=>u.has(id)))u.add("b_final");if(IIDS.every(id=>u.has(id)))u.add("i_mean");return u;}
function exFor(itemId){const t=INTENTS.find(t=>(t.unlock||[]).includes(itemId));return t?t.ex:"";}
function dmin(v){return (+(v&&v.h||0))*60+(+(v&&v.m||0));}
function judge(i,k){const v=S[i.id];if(!k||k.ans===undefined)return null;if(!answered(i))return null;
  switch(i.type){
   case "radio":return v===k.ans;
   case "checks":case "checklist":{const a=(v||[]).slice().sort().join("|"),b=k.ans.slice().sort().join("|");return a===b;}
   case "days":return k.ans.none?!!v.none:(!v.none&&+v.d===+k.ans.d);
   case "dur":return !v.unk&&dmin(v)===dmin(k.ans);
   case "number":return +v===+k.ans;
   default:return String(v).trim()===String(k.ans);}}
function ansText(i,k){const a=k.ans;
  if(i.type==="days")return a.none?i.none:a.d+" 天";
  if(i.type==="dur")return `一天 ${a.h} 小時 ${a.m} 分鐘`;
  if(Array.isArray(a))return a.join("、");
  return a;}
function fbHTML(i,k){
  if(!G.practice||!k)return "";
  if(k.ref!==undefined){
    if(!G.reveal[i.id])return answered(i)?`<button type="button" class="btn small" data-reveal="${i.id}">看參考重點</button>`:"";
    return `<div class="fb ref"><b>參考重點</b><div class="why" style="white-space:pre-line">${esc(k.ref)}</div></div>`;}
  const r=judge(i,k);if(r===null)return "";
  return `<div class="fb ${r?"right":"wrong"}"><b>${r?"答對了":"再想想"}</b>${r?"":`<div class="why">參考答案：${esc(ansText(i,k))}</div>`}${k.why?`<div class="why">${esc(k.why)}</div>`:""}${k.disc?`<div class="disc">討論重點：${esc(k.disc)}</div>`:""}</div>`;}

     <p class="msg" style="font-size:15px;margin:0">到個案家中訪視：自己輸入問題，阿嬤或媳婦會回答。問到的項目會在評估單區打開（電腦在右側、手機在對話下方），依照回答勾選。問完、勾完，評估單就完成了，可以匯出 PDF（含對話紀錄）。</p>
     ${SCENARIOS.map(s=>`<div class="sc-card"><h3 style="font-size:20px">${esc(s.title)}</h3><p class="msg" style="margin:0">${esc(s.sub)}</p>
       <div class="inline">${S.scenarioId===s.id?`<button type="button" class="btn primary" data-resume="${s.id}">繼續訪視</button><button type="button" class="btn" data-start="${s.id}">重新開始（清除作答）</button>`:`<button type="button" class="btn primary" data-start="${s.id}">${Object.keys(S).length?"開始訪視（會清除目前作答）":"開始訪視"}</button>`}</div></div>`).join("")}
    </div>`;return;}
  v.innerHTML=`<div class="chatlayout">
   <section class="chatpane" aria-label="訪視對話">
    <div class="chathead"><div><b>${esc(sc.title)}</b><span class="msg" id="c-stat"></span></div>${pill}</div>
    <div class="chatlog" id="chatlog" aria-live="polite"></div>
    <form class="chatin" id="chatform" autocomplete="off">
     <textarea id="chat-in" rows="2" placeholder="輸入你要問阿嬤或媳婦的問題，按 Enter 送出"></textarea>
     <button type="submit" class="btn primary">送出</button>
    </form>
    <div class="chatfoot"><button type="button" class="btn ghost small" id="g-quit">換情境</button><button type="button" class="btn ghost small" id="g-tip">提問小技巧</button></div>
   </section>
   <section class="panel" aria-label="評估單" id="gpanel"></section>
  </div>`;
  drawLog();drawPanel();refresh();
}
function drawLog(){const L=$("#chatlog");if(!L)return;L.innerHTML=(S.chat||[]).map(bubble).join("");L.scrollTop=L.scrollHeight;}
function drawPanel(){const P_=$("#gpanel");if(!P_)return;const U=unlocked();const K=KEYS();
  P_.innerHTML=UNITS.map(u=>{
    const secs=u.secs.map(s=>{
      const its=s.items.filter(i=>!i.opt||["cg2","prep_note","respondent"].includes(i.id));
      if(!its.length)return "";
      const body=its.map(i=>{
        if(i.type==="note")return s.items.some(x=>x.type!=="note"&&U.has(x.id))?itemHTML(i):"";
        if(U.has(i.id))return itemHTML(i,{key:K});
        const ex=exFor(i.id);
        return `<div class="item locked" data-lock="${i.id}"><div class="no"><span class="dot" aria-hidden="true"></span><span>${i.no}</span></div><div class="body"><div class="lbl">${esc(i.label)}<em>${NO_ASK.has(i.id)?"問完相關項目後開放":"尚未問到"}</em></div>${G.practice&&ex?`<button type="button" class="learnlink" data-ask="${esc(ex)}">提示：可以怎麼問？</button>`:""}</div></div>`;}).join("");
      return `<div class="sec"><h3>${s.title}</h3><div class="items">${body}</div></div>`;}).join("");
    return `<div class="punit"><h2 class="ph ${u.dom}">${u.key}. ${u.title}</h2>${secs}</div>`;}).join("");
}
function refreshGuide(){const K=KEYS();
  $$("[data-fb]").forEach(slot=>{const id=slot.dataset.fb;slot.innerHTML=fbHTML(BY[id],K[id]);});
  const st=$("#c-stat");if(st){const U=unlocked();const ask=ALL.filter(i=>i.type!=="note"&&!i.opt&&!NO_ASK.has(i.id));const got=ask.filter(i=>U.has(i.id)).length;
    let s=`　已問到 ${got} / ${ask.length} 項`;
    if(G.practice){let ok=0,n=0;Object.keys(K).forEach(id=>{const r=judge(BY[id],K[id]);if(r!==null){n++;if(r)ok++;}});if(n)s+=`・答對 ${ok} / ${n}`;}
    st.textContent=s;}}
function nextOpenGuide(){return null;}
function startScenario(id){const sc=SCENARIOS.find(x=>x.id===id);
  S={scenarioId:id,scenario:sc.summary,asked:[],chat:[[O_,"今天下午 2:00，你到林陳翠琴阿嬤家中訪視。阿嬤坐在客廳藤椅上，右耳戴助聽器，左耳聽力較差，說話要放慢、音量稍大，旁邊有一位家屬陪同。"],[O_,"家中是三樓透天厝。一樓有客廳、廚房、浴室和阿嬤的臥室，二樓是神明廳和兒子夫妻的房間，三樓是孫子女的房間。"],["sys","請先自我介紹、說明來意，再開始提問。評估單會依你問到的內容逐項打開。"]]};
  G.reveal={};save();renderGuide();window.scrollTo(0,0);}
let busy=false;
function ask(q){q=q.trim();if(!q||busy)return;S.chat=S.chat||[];S.asked=S.asked||[];
  S.chat.push(["me",q]);drawLog();save();
  const hits=matchQ(q);busy=true;
  const before=unlocked();
  setTimeout(()=>{busy=false;
    const lab=m=>m[0]===D_?[m[0],m[1],(S.asked.includes("relation")||S.asked.includes("caregiver"))?"媳婦":"家屬"]:m;
    if(!hits.length){S.miss=(S.miss||0)+1;S.chat.push(lab(MISS[(S.miss-1)%MISS.length]));}
    else{hits.forEach(t=>{if(!S.asked.includes(t.id))S.asked.push(t.id);t.msgs.forEach(m=>S.chat.push(lab(m)));});}
    const after=unlocked();const fresh=[...after].filter(x=>!before.has(x)&&BY[x]&&!START_UNLOCK.includes(x));
    if(fresh.length)S.chat.push(["sys","評估單已打開："+fresh.map(id=>`<button type="button" class="chip" data-jump="${id}">${BY[id].no} ${esc(BY[id].label.replace(/^\d+\.\s*/,"").slice(0,18))}</button>`).join("")]);
    save();drawLog();if(fresh.length){drawPanel();refresh();fresh.forEach(id=>{const el=$("#it-"+id);if(el){el.classList.add("focus");setTimeout(()=>el.classList.remove("focus"),1800);}});}
  },matchMedia("(prefers-reduced-motion: reduce)").matches?0:450);
}

/* ============ PDF ============ */
const E='<span class="empty">（未填）</span>';
function fmt(i){const v=S[i.id];
  switch(i.type){
   case "checks":case "checklist":{const a=Array.isArray(v)?v:[];if(!a.length)return E;let s=a.map(x=>"☑ "+esc(x)).join("\n");if(i.type==="checklist"){const miss=i.opts.filter(o=>!a.includes(o));if(miss.length)s+="\n☐ "+miss.map(esc).join("　☐ ");}return s;}
   case "radio":{if(!v)return E;let s="☑ "+esc(v);if(i.other&&v===i.other&&S[i.id+"_o"])s+="："+esc(S[i.id+"_o"]);if(i.withNote&&S[i.id+"_n"])s+="\n補充："+esc(S[i.id+"_n"]);return s;}
   case "family":{let s=v?esc(v):"";if(S.tree_img)s+=(s?"\n":"")+`<img src="${S.tree_img}">`;return s||E;}
   case "days":{if(!v)return E;return v.none?"☑ "+esc(i.none):(v.d!==undefined&&v.d!==""?esc(v.d)+" 天":E);}
   case "dur":{if(!v)return E;if(v.unk)return "☑ 不知道／不確定";if(!v.h&&!v.m)return E;return `一天 ${esc(v.h||0)} 小時 ${esc(v.m||0)} 分鐘`;}
   default:return v!==undefined&&String(v).trim()!==""?esc(v):E;}}
const plain=h=>h.replace(/<br>/g,"\n").replace(/<\/li>/g,"\n").replace(/<\/div>/g," ").replace(/<\/span>/g," ").replace(/<[^>]+>/g,"").replace(/[ \t]+/g," ").replace(/\n\s+/g,"\n").trim();
function reportBlocks(ids){const out=[];
  const head=document.createElement("div");head.className="rp-block";
  head.innerHTML=`<h1>高齡周全性健康評估問卷－ADL/IADL</h1><div class="sub">亞洲大學長期照護學系｜高齡周全性健康評估與實作｜匯出內容：${ids.map(id=>{const u=UNITS.find(x=>x.id===id);return u.key+". "+u.title;}).join("、")}</div>
  <table><tr><th style="width:16%">組別</th><td>${esc(S.group)||E}</td><th style="width:20%">評估日期及時間</th><td>${esc((S.datetime||"").replace("T"," "))||E}</td></tr>
  <tr><th>評估者</th><td>${esc(S.assessor)||E}</td><th>受評者</th><td>${esc(S.client)||E}</td></tr>
  <tr><th>受評者角色及情境設定</th><td colspan="3">${esc(S.scenario)||E}</td></tr></table>`;
  out.push(head);
  ids.forEach(id=>{const u=UNITS.find(x=>x.id===id);
    let headHTML=`<h2 class="${u.dom}">${u.key}. ${u.title}</h2>`;
    u.secs.forEach(s=>{const rows=[];
      s.items.forEach(i=>{
        if(i.type==="note"){const r=i.fn(S);if(r&&!(r[0]==="info"&&/這裡會/.test(r[2])))rows.push(`<tr><td class="k">${esc(r[1])}</td><td>${esc(plain(r[2]))}</td></tr>`);return;}
        if(!vis(i))return;if(["scenario","group","datetime","assessor","client"].includes(i.id))return;
        const sc=i.score&&i.score!=="yn"?`（${scoreOf(i,S[i.id])??"—"} / ${maxOf(i)} 分）`:"";
        rows.push(`<tr><td class="k">${esc(i.label)}${sc}</td><td>${fmt(i)}</td></tr>`);});
      if(!rows.length)return;
      const b=document.createElement("div");b.className="rp-block";b.innerHTML=headHTML+`<table><tr><td colspan="2" class="sect">${s.title}</td></tr>${rows.join("")}</table>`;headHTML="";out.push(b);});
  });
  if(S.chat&&S.chat.some(m=>m[0]==="me")){
    const rows=S.chat.filter(m=>m[0]!=="sys").map(m=>`<tr><td class="k" style="width:14%">${m[2]||{me:"評估者",e:"阿嬤",d:"家屬",o:"觀察"}[m[0]]||""}</td><td>${esc(m[1])}</td></tr>`).join("");
    const b=document.createElement("div");b.className="rp-block";b.innerHTML=`<h2>訪談對話紀錄</h2><table>${rows}</table>`;out.push(b);}
  return out;}
async function exportPDF(ids,btn){
  const msg=$("#x-msg");const say=(m,c)=>{if(msg){msg.textContent=m;msg.className="msg "+(c||"");}else toast(m);};
  if(!window.html2canvas||!window.jspdf){say("PDF 元件尚未載入，請稍候再試","bad");return;}
  const old=btn.textContent;btn.disabled=true;btn.textContent="產生中…";
  try{
    await document.fonts.ready;
    const host=$("#report");host.innerHTML="";const wrap=document.createElement("div");wrap.className="rp";host.appendChild(wrap);
    const blocks=reportBlocks(ids);blocks.forEach(b=>wrap.appendChild(b));
    await Promise.all($$("img",wrap).map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4"});
    const M=12,W=210-2*M,Hh=297-2*M-6;let y=M,page=1;
    const footer=()=>{pdf.setFontSize(8);pdf.setTextColor(140);pdf.text(String(page),105,297-7,{align:"center"});};
    for(const b of blocks){
      const c=await html2canvas(b,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
      const mmPerPx=W/c.width;const hmm=c.height*mmPerPx;
      if(hmm<=Hh){if(y+hmm>M+Hh){footer();pdf.addPage();page++;y=M;}pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",M,y,W,hmm);y+=hmm+2;}
      else{let sy=0;while(sy<c.height){let avail=M+Hh-y;if(avail<20){footer();pdf.addPage();page++;y=M;avail=Hh;}const sliceH=Math.min(c.height-sy,Math.floor(avail/mmPerPx));const sc=document.createElement("canvas");sc.width=c.width;sc.height=sliceH;const x=sc.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,sc.width,sc.height);x.drawImage(c,0,sy,c.width,sliceH,0,0,c.width,sliceH);pdf.addImage(sc.toDataURL("image/jpeg",.92),"JPEG",M,y,W,sliceH*mmPerPx);y+=sliceH*mmPerPx+2;sy+=sliceH;}}
    }
    footer();host.innerHTML="";
    const blob=pdf.output("blob");
    const part=ids.length===UNITS.length?"完整":ids.map(id=>UNITS.find(u=>u.id===id).title.replace(/（.*?）/g,"")).join("+");
    const fname=`ADL_IADL評估單_${S.group?S.group+"組_":""}${S.assessor||"學生"}_${part}.pdf`.replace(/[\\/:*?"<>|]/g,"");
    await saveFile(fname,blob);say("已產生 PDF："+fname,"ok");
  }catch(err){const c=err&&err.code;say(c==="declined"?"已取消下載":c==="rate_limited"?"已有一個下載視窗開啟，請先處理後再試":c==="nodl"?"這個檢視無法下載檔案。請在 claude.ai 中開啟此頁再匯出。":"產生 PDF 時發生問題，請再試一次","bad");}
  finally{btn.disabled=false;btn.textContent=old;}
}
/* 下載：在 claude.ai 用 downloads 能力，其他網站（GitHub Pages）用一般下載 */
async function saveFile(name,blob){
  if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(!dl)throw {code:"nodl"};return dl.save({filename:name,data:blob});}
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function saveJSON(btn){const msg=$("#x-msg");
  try{await saveFile(`ADL_IADL評估單作答檔_${S.assessor||"學生"}.json`,new Blob([JSON.stringify(S)],{type:"application/json"}));msg.textContent="已下載作答檔";msg.className="msg ok";}
  catch(err){msg.textContent=err&&err.code==="declined"?"已取消下載":err&&err.code==="nodl"?"這個檢視無法下載檔案。":"下載失敗，請再試一次";msg.className="msg bad";}}

const hh=location.hash.slice(1);
if(T[hh]){setMode("learn");setTimeout(()=>{const el=document.getElementById(hh);if(el)el.scrollIntoView();},50);}
else if(hh==="practice"||hh==="homework")setMode("guide");
else setMode(["learn","guide","form"].includes(UI.mode)?UI.mode:"form");
</script>
