<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="亞洲大學長期照護學系 高齡周全性健康評估與實作 第7週：日常生活活動功能（ADL）與工具式日常生活活動功能（IADL）教材與評估單實作">
<title>ADL與IADL評估實作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky header with two modes (學習 / 評估單); 評估單 = unit rail on the left + item cards, one item answered after another. */
:root{
  --paper:#F3F6F6; --surface:#FFFFFF; --sunk:#E9EFEF; --ink:#14232B; --muted:#56676E; --line:#D3DDDF;
  --accent:#0E6767; --accent-ink:#FFFFFF; --accent-soft:#DDEFEE;
  --vision:#A84C0A; --vision-soft:#FBEADB; --hearing:#2A5BA6; --hearing-soft:#E2EBF8;
  --ok:#2C7A47; --ok-soft:#E1F1E6; --warn:#B3261E; --warn-soft:#FBE4E1;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1618; --surface:#162125; --sunk:#1C2A2F; --ink:#E3ECEE; --muted:#93A6AC; --line:#2B3B40;
  --accent:#5EC3BE; --accent-ink:#06201F; --accent-soft:#163533;
  --vision:#F0A262; --vision-soft:#3A2617; --hearing:#91B5F2; --hearing-soft:#1A2A43;
  --ok:#73C98F; --ok-soft:#173225; --warn:#F28B82; --warn-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1618; --surface:#162125; --sunk:#1C2A2F; --ink:#E3ECEE; --muted:#93A6AC; --line:#2B3B40;
  --accent:#5EC3BE; --accent-ink:#06201F; --accent-soft:#163533;
  --vision:#F0A262; --vision-soft:#3A2617; --hearing:#91B5F2; --hearing-soft:#1A2A43;
  --ok:#73C98F; --ok-soft:#173225; --warn:#F28B82; --warn-soft:#3B1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.brand h1{font-size:19px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:progress}
.progress{height:3px;background:var(--sunk)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* learn */
.learn{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-block:24px 60px}
.toc{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:14px}
.toc h4{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.toc a{color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:6px;border-left:3px solid transparent}
.toc a:hover{background:var(--sunk)}
.toc a.v{border-left-color:var(--vision)} .toc a.h{border-left-color:var(--hearing)} .toc a.a{border-left-color:var(--accent)}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:12px}
.intro h2{font-size:24px}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{background:var(--sunk);border-radius:8px;padding:8px 14px;min-width:150px}
.fact b{font-family:var(--f-mono);font-size:22px;display:block}
.fact span{font-size:13px;color:var(--muted)}
.topic{padding-block:28px 8px;border-bottom:1px solid var(--line);display:grid;gap:12px;scroll-margin-top:90px}
.topic .tag{font-size:12px;letter-spacing:.08em;font-weight:500}
.topic.v .tag{color:var(--vision)} .topic.h .tag{color:var(--hearing)} .topic.a .tag{color:var(--accent)}
.topic h3{font-size:21px}
.prose{max-width:68ch}
.prose p{margin:0 0 .6em}
.prose ul,.prose ol{margin:0 0 .6em;padding-left:1.3em}
.prose li{margin:.15em 0}
.prose b{font-weight:700}
.prose .flow{font-size:14px;background:var(--sunk);padding:10px 14px;border-radius:8px}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
figure img{display:block;width:100%;height:auto;cursor:zoom-in;background:#fff}
figure figcaption{font-size:12px;color:var(--muted);padding:6px 10px}
table.mini{border-collapse:collapse;font-size:14px;width:100%}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.mini th{background:var(--sunk);font-weight:500}
.tbl{overflow-x:auto}
.amsler{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.amsler svg{width:220px;max-width:100%;height:auto;background:var(--surface);border:1px solid var(--line)}
.amsler .prose{flex:1 1 240px}

/* form */
.form{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:22px 80px}
.rail{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:6px}
.unit-btn{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;text-align:left;border:1px solid transparent;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.unit-btn:hover{background:var(--sunk)}
.unit-btn[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.unit-btn .k{grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;background:var(--sunk);color:var(--muted)}
.unit-btn[data-dom="v"] .k{background:var(--vision-soft);color:var(--vision)}
.unit-btn[data-dom="h"] .k{background:var(--hearing-soft);color:var(--hearing)}
.unit-btn .t{font-weight:500;font-size:14px}
.unit-btn .c{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.unit-btn.done .c{color:var(--ok)}
.rail .opt{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:10px;padding:0 10px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;gap:4px;margin-bottom:18px}
.case b{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.unit-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin-bottom:6px}
.unit-head h2{font-size:24px}
.unit-head .meta{font-size:13px;color:var(--muted)}
.sec{margin-top:26px}
.sec>h3{font-size:16px;font-family:var(--f-body);font-weight:700;padding-bottom:6px;border-bottom:2px solid var(--line);margin-bottom:12px;display:flex;gap:10px;align-items:baseline}
.sec>h3 span{font-size:12px;color:var(--muted);font-weight:400}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;scroll-margin-top:110px;transition:border-color .2s}
.item.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.item .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.item.ok .dot{background:var(--ok);border-color:var(--ok)}
.item.ok .dot::after{content:"";width:8px;height:4px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.item .body{display:grid;gap:8px;min-width:0}
.item .lbl{font-weight:500}
.item .lbl em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.hint{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}
.hint ol,.hint ul{margin:0;padding-left:1.3em}
.learnlink{justify-self:start;border:0;background:transparent;color:var(--accent);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea,select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px}
textarea{min-height:76px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;background:var(--paper);font-size:14px}
.choice input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.choice.sq span{border-radius:6px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline input[type=text]{flex:1 1 180px;width:auto}
.quick{display:flex;gap:6px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ear{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;background:var(--paper)}
.ear h5{margin:0;font-size:14px}
.ear .row{display:grid;gap:4px}
.ear .row small{color:var(--muted)}
.res{font-size:13.5px;border-radius:8px;padding:8px 12px;background:var(--sunk)}
.res.ok{background:var(--ok-soft);color:var(--ok)}
.res.bad{background:var(--warn-soft);color:var(--warn)}
.note{border-radius:var(--r);padding:12px 16px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.note.bad{border-color:var(--warn);background:var(--warn-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note>b{display:block;margin-bottom:2px}
.note ol{margin:4px 0 0;padding-left:1.3em}
.icope{display:grid;gap:10px}
.icope .grp{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.icope .grp>b{font-size:13px;letter-spacing:.06em}
.icope .grp.bad>b{color:var(--warn)} .icope .grp.ok>b{color:var(--ok)}
.icope .r{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
@media (max-width:520px){.icope .r{grid-template-columns:1fr}}
.tree-img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.unit-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.unit-foot .grow{display:flex;gap:8px;flex-wrap:wrap}
.nextfab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mob-units{display:none}

/* drawer + modal + lightbox */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:41;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,calc(env(safe-area-inset-right,0px) + 20px)) calc(env(safe-area-inset-bottom,0px) + 30px) 20px;box-shadow:-6px 0 24px rgba(0,0,0,.2)}
.drawer .close{position:sticky;top:0;float:right}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:12px;z-index:41;padding:20px 22px;display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{font-size:19px}
.modal label.row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.msg{font-size:13.5px;color:var(--muted)}
.msg.bad{color:var(--warn)} .msg.ok{color:var(--ok)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,10,12,.88);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;z-index:60;font-size:14px}

#report{position:fixed;left:-12000px;top:0;width:760px}

@media (max-width:900px){
  .learn,.form{grid-template-columns:minmax(0,1fr)}
  .toc,.rail{display:none}
  .mob-units{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .mob-units .unit-btn{flex:0 0 auto;grid-template-columns:24px auto;background:var(--surface);border-color:var(--line)}
  .mob-units .unit-btn .k{width:24px;height:24px;font-size:12px}
  .mob-units .unit-btn[aria-current="true"]{border-color:var(--accent)}
  .item{grid-template-columns:1fr}
  .item .no{flex-direction:row;align-items:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* report (PDF) - fixed light print palette */
.rp{font-family:var(--f-body);color:#111;background:#fff;font-size:13px;line-height:1.6;padding:0}
.rp-block{background:#fff;padding:4px 0}
.rp h1{font-family:var(--f-display);font-size:20px;text-align:center;margin:0 0 2px}
.rp .sub{text-align:center;font-size:12px;color:#444;margin-bottom:8px}
.rp h2{font-family:var(--f-display);font-size:16px;margin:6px 0 4px;padding:4px 8px;background:#E8EEEE;border-left:4px solid #0E6767}
.rp h2.v{border-left-color:#A84C0A} .rp h2.h{border-left-color:#2A5BA6}
.rp table{width:100%;border-collapse:collapse;table-layout:fixed}
.rp td,.rp th{border:1px solid #888;padding:5px 7px;vertical-align:top;word-break:break-word;white-space:pre-wrap}
.rp th{background:#F1F4F4;font-weight:700;text-align:left}
.rp td.k{width:30%;background:#FAFBFB}
.rp .empty{color:#999}
.rp .sect{font-weight:700;background:#F1F4F4}
.rp img{max-width:100%;max-height:420px}
</style>
<style>
.score{font-family:var(--f-mono);font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:8px;white-space:nowrap}
.item.ok .score{background:var(--accent-soft);color:var(--accent)}
.choices.stack{flex-direction:column;align-items:stretch}
.choices.stack .choice span{border-radius:8px;display:block}
.tally{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:120px}
.tally b{font-family:var(--f-mono);font-size:20px;display:block;line-height:1.3}
.tally span{font-size:12px;color:var(--muted)}
.dd{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dd input[type=number]{width:96px}
.dd label{display:flex;gap:6px;align-items:center;font-size:14px}
details.quiz{background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px}
details.quiz summary{cursor:pointer;color:var(--accent)}
.sticky-score{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:5;margin-top:10px}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand">
      <small>亞洲大學長期照護學系｜高齡周全性健康評估與實作｜第 7 週</small>
      <h1>日常生活活動功能評估</h1>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-learn" aria-selected="false" data-mode="learn">課堂教材</button>
      <button role="tab" id="tab-form" aria-selected="true" data-mode="form">評估單實作</button>
    </div>
    <div class="top-actions">
      <button class="btn primary" id="btn-export" type="button">匯出 PDF</button>
    </div>
  </div>
  <div class="progress" title="評估單完成度"><i id="prog"></i></div>
</header>

<main class="wrap">
  <section id="view-learn" hidden></section>
  <section id="view-form"></section>
</main>

<button class="btn primary nextfab" id="btn-next" type="button">下一個未完成項目 ↓</button>
<div id="report" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ============ 各項評分定義（取自課堂簡報） ============ */
const H = {
 b1:`<ol><li><b>可自行維持坐姿平衡，移至椅子或用輪椅</b>：可獨立完成整個移位過程，包括自行維持坐姿平衡、由床移至椅子或輪椅、使用輪椅的煞車和移動腳踏板，都不需他人協助、監督或持續敦促，且沒有安全上顧慮。</li><li><b>移位時需少部分協助或提醒</b>：需少許協助或提醒方能完成；或移位過程有安全上顧慮，需有人在旁監督或持續敦促。</li><li><b>可自行維持坐姿平衡，離床需大部分協助</b>：能自行維持坐姿平衡，但移位過程需他人大部分協助。</li><li><b>需完全協助（完全依賴）</b>：完全需他人協助才能維持坐姿平衡或幫忙移位。</li></ol>`,

 i1:`<p>問法：請問您當需要聯絡他人時，您能不能自己打電話？</p><ul><li>僅能撥熟悉的電話號碼：只能撥少於 5 組的常用電話。</li><li>僅會接電話：只能接聽電話，並聽懂對方所說的內容。</li></ul><p><b>聽覺障礙者</b>：此題評估與外界溝通（聯絡）的能力，若會使用傳真機、通訊軟體、具視頻字幕擴音功能電話機或其他溝通媒介，可視為有此能力。</p>`,
 i2:`<p>問法：請問您能不能自己一個人購物（買東西）？</p><p>評估個案是否有購物的能力，以及購買的複雜程度；<b>使用何種交通工具去購物不是本題評估範圍</b>。</p><ul><li>獨立購買日常生活用品：僅能在附近商店購買簡單日常必需品（如便當、衛生紙），較複雜的品項需要有人陪。</li><li>每一次上街購物都需要有人陪：只要有人陪伴就可以完成購物。</li><li>完全不會上街購物：因身體、精神或智能因素完全不能購物，例如長期臥床、昏迷或心智功能障礙者。</li></ul>`,
 i3:`<p>問法：請問您能不能自己一個人準備餐食？包括備食材及佐料、清洗、煮食、配菜、食具擺設，各式工具及方法皆可使用。</p><ul><li>如果準備好一切佐料會做一頓飯菜：備餐完成後不會遺漏需使用的主要食材。</li><li>會將已做好的飯菜加熱：可正確使用電器用品（電鍋、微波爐等）加熱。</li></ul><p><b>評估技巧</b>：若個案平時不需自己煮，可問「如果家人都不在家或商家都沒有營業（如過年）時，您能不能自己加熱飯菜？或自己煮一頓飯菜？」</p>`,
 i4:`<p>問法：請問您能不能自己一個人做家事？（整理房間、掃地、拖地、洗碗、擦桌子；清潔程度如何？需要別人幫忙看碗是否洗乾淨嗎？）</p><ul><li><b>獨居個案</b>：以自己住所之家務清潔整理為範圍。</li><li><b>非獨居個案</b>：以個案活動區域為範圍，如房間和客廳之整理，以及飲食用餐具的洗滌。</li></ul>`,
 i5:`<p>問法：請問您能不能自己一個人洗衣服（含晾曬衣服）？<b>洗衣和晾曬兩者皆能自行完成，才算獨立完成</b>。</p><ul><li>原本沒有洗衣習慣：問「若家人不在家，必須自己洗衣時，能不能自己清洗小件衣物或所有衣物？」</li><li>使用洗衣機：是否會把衣服丟進洗衣機、倒入適量清潔劑並按鈕開始清洗。</li><li>機構住民：看的是能力，而非環境的限制和機構的制度。</li></ul>`,
 i6:`<p>問法：請問您能不能自己一個人外出活動？</p><p>評估個案在<b>無人陪同</b>下，能否使用交通工具（不限種類）獨立外出到較遠的地方（不是只到住家附近公園散步），且安全到達目的地並安全回來。</p><ul><li>搭乘大眾運輸工具需要較高的能力：規劃路線、知道到哪裡搭車、哪一站下車、到站後如何走到目的地。</li><li>搭乘計程車需要的能力較低：路邊招車或電話叫車即可到目的地。</li></ul>`,
 i7:`<p>問法：請問您能不能自己一個人服用藥物？</p><ul><li>需要提醒或少許協助／事先準備好份量可自行服用：有時會忘記吃藥，需提醒時間或份量，或需他人準備好份量、依時間排好放進藥盒、在藥包上做記號，個案再自行服用。</li><li>不能自己服用藥物：包含亂吃、拒吃、藏藥、無法自行服藥。</li></ul><p><b>評估技巧</b>：若個案目前不用吃藥，詢問感冒時可否自行依照時間服用藥物。</p>`,
 i8:`<p>問法：請問您能不能自己一個人處理財務？</p><ul><li>可以獨立處理財務：到郵局（銀行）提存款、支付房租、帳單、給錢、找錢等。</li><li>可以處理日常的購買：只能處理日常購買（給錢、找錢），無法處理與銀行往來或金額較大的財務往來。</li></ul>`,

UNITS.forEach(u=>{let n=0;u.secs.forEach(s=>s.items.forEach(it=>{it.unit=u.id;if(it.type!=="note"){n++;it.no=u.key+"-"+n;}}));});
const ALL = UNITS.flatMap(u=>u.secs.flatMap(s=>s.items));
const BY = Object.fromEntries(ALL.map(i=>[i.id,i]));

/* ============ 計分與判讀 ============ */
function scoreOf(i,v){ if(!v) return null;
  if(i.score==="paren"){const m=v.match(/\((\d+)\)\s*$/);return m?+m[1]:null;}
  if(i.score==="lead"){const m=v.match(/^(\d)/);return m?+m[1]:null;}
  if(i.score==="yn") return v.startsWith("是")?1:0;
  return null;}
const maxOf=i=>Math.max(...i.opts.map(o=>scoreOf(i,o)));
const BIDS=["b1","b2","b3","b4","b5","b6","b7","b8","b9","b10"];
const IIDS=["i1","i2","i3","i4","i5","i6","i7","i8"];
function sumOf(ids){let t=0,n=0;ids.forEach(id=>{const s=scoreOf(BY[id],S[id]);if(s!==null){t+=s;n++;}});return [t,n];}
function barthelLevel(t){return t===100?"完全獨立（100）":t>=91?"輕度依賴（91–99）":t>=61?"中度依賴（61–90）":t>=21?"嚴重依賴（21–60）":"完全依賴（0–20）";}
function barthelNeedHelp(S){return BIDS.some(id=>{const s=scoreOf(BY[id],S[id]);return s!==null&&s<maxOf(BY[id]);});}
function barthelNote(S){const [t,n]=sumOf(BIDS);
  const dep=BIDS.filter(id=>{const s=scoreOf(BY[id],S[id]);return s!==null&&s<maxOf(BY[id]);}).map(id=>BY[id].label.replace(/^\d+\.\s*/,""));
  const tally=`<div class="tally"><div><b>${t}</b><span>總分（已填 ${n}/10 項）</span></div>${n===10?`<div><b style="font-size:16px">${barthelLevel(t)}</b><span>說明（依總分）</span></div>`:""}</div>`;
  const kind=n<10?"info":t===100?"ok":"bad";
  return [kind,"巴氏量表總分",tally+(n<10?"評估單註明「不可空白」，請完成全部 10 項。":"")+(dep.length?`需協助項目：${dep.join("、")}`:"")];}
function sofNote(S){const ids=["s1","s2","s3"];const [t,n]=sumOf(ids);if(!n)return null;
  const lv=t>=2?"衰弱":t===1?"衰弱前期":"健壯";
  return [n<3?"info":t>=2?"bad":t===1?"info":"ok","SOF 總分："+t+" 分"+(n<3?`（已填 ${n}/3）`:""),n<3?"請完成三題。":`判讀參考：${lv}（0 分健壯、1 分衰弱前期、≥2 分衰弱）。`];}
const HELP5={i1:s=>s<=1,i2:s=>s<=1,i3:s=>s===0,i4:s=>s<=1,i5:s=>s===0};
function iadlHelp(S){return Object.keys(HELP5).filter(id=>{const s=scoreOf(BY[id],S[id]);return s!==null&&HELP5[id](s);});}
function iadlNote(S){const [t,n]=sumOf(IIDS);if(!n)return null;
  const h=iadlHelp(S),names=h.map(id=>BY[id].label);
  const done5=Object.keys(HELP5).every(id=>S[id]);
  let msg=`<div class="tally"><div><b>${t} / 24</b><span>IADL 總分（已填 ${n}/8 項）</span></div><div><b>${h.length} / 5</b><span>五項中需協助項目</span></div></div>`;
  if(names.length)msg+="需協助："+names.join("、")+"。";
  if(done5)msg+=h.length>=3?"<br><b>五項中有三項以上需要協助，符合輕度失能。</b>":"<br>五項中需協助未達三項，未達輕度失能。";
  msg+=`<br><span style="font-size:12.5px;opacity:.8">「需協助」判定：購物、外出為 1 或 0 分；烹調、洗衣為 0 分；家務為 1 或 0 分。</span>`;
  return [h.length>=3?"bad":"info","IADL 計分",msg];}
const daysOn=v=>!!v&&!v.none&&+v.d>0;
function mins(v){if(!v||v.unk)return null;const h=+(v.h||0),m=+(v.m||0);if(!v.h&&!v.m)return null;return Math.min(180,h*60+m);}
function ipaq(S){const part=(d,t,met)=>{if(!S[d])return null;if(!daysOn(S[d]))return {days:0,min:0,met:0};const mm=mins(S[t]);if(mm===null)return {days:+S[d].d,min:null,met:null};return {days:+S[d].d,min:mm,met:met*mm*(+S[d].d)};};
  const V=part("pv_d","pv_t",8),M=part("pm_d","pm_t",4),W=part("pw_d","pw_t",3.3);
  if(!V||!M||!W||V.met===null||M.met===null||W.met===null) return null;
  const tot=Math.round(V.met+M.met+W.met), days=V.days+M.days+W.days;
  let lv="低度";
  if((V.days>=3&&V.met>=1500)||(days>=7&&tot>=3000)) lv="高度";
  else if((V.days>=3&&V.min>=20)||(M.days+W.days>=5&&(Math.max(M.min,W.min)>=30))||(days>=5&&tot>=600)) lv="中度";
  return {V,M,W,tot,lv};}
function ipaqNote(S){const r=ipaq(S);const sit=mins(S.ps_t);
  if(!r) return ["info","身體活動量","完成二～四題後，這裡會計算每週 MET-分鐘與活動量等級（依 IPAQ 計分原則，供參考）。"];
  return ["info","身體活動量（判讀參考）",`<div class="tally"><div><b>${r.tot.toLocaleString()}</b><span>MET-分鐘／週</span></div><div><b style="font-size:16px">${r.lv}身體活動量</b><span>等級</span></div>${sit!==null?`<div><b>${(S.ps_t.h||0)}時${(S.ps_t.m||0)}分</b><span>工作天每日坐著</span></div>`:""}</div>費力 ${Math.round(r.V.met)}・中等 ${Math.round(r.M.met)}・走路 ${Math.round(r.W.met)} MET-分鐘／週。`];}
function overall(S){const rows=[];
  const [bt,bn]=sumOf(BIDS);if(bn)rows.push(`巴氏量表：${bt} 分${bn===10?"，"+barthelLevel(bt):`（已填 ${bn}/10）`}${S.b_final?"；最後級分："+S.b_final:""}`);
  const dep=BIDS.filter(id=>{const s=scoreOf(BY[id],S[id]);return s!==null&&s<maxOf(BY[id]);}).map(id=>BY[id].label.replace(/^\d+\.\s*/,""));if(dep.length)rows.push("ADL 需協助：" + dep.join("、"));
  const [st,sn]=sumOf(["s1","s2","s3"]);if(sn===3)rows.push(`SOF 衰弱評估：${st} 分（${st>=2?"衰弱":st===1?"衰弱前期":"健壯"}）`);
  const [it,inn]=sumOf(IIDS);if(inn){const h=iadlHelp(S);rows.push(`IADL：${it}/24 分；五項中需協助 ${h.length} 項${h.length>=3?"，符合輕度失能":""}`);}
  const r=ipaq(S);if(r)rows.push(`IPAQ：${r.tot.toLocaleString()} MET-分鐘／週，${r.lv}身體活動量`);
  if(!rows.length) return ["info","評估結果整理","完成前面各單元後，這裡會整理 ADL、衰弱、IADL 與活動量結果，幫你撰寫健康問題與建議。"];
  return ["info","評估結果整理","<ol>"+rows.map(x=>"<li>"+x+"</li>").join("")+"</ol>"];}

    case "dur":return !!v&&(v.unk||!!v.h||!!v.m);
    default:return v!==undefined&&String(v).trim()!=="";
  }}
const countable=i=>i.type!=="note"&&!i.opt&&vis(i);
function unitStat(u){const its=u.secs.flatMap(s=>s.items).filter(countable);return [its.filter(answered).length,its.length];}

async function exportPDF(ids,btn){

    }

    const fname=`ADL_IADL評估單_${S.group?S.group+"組_":""}${S.assessor||"學生"}_${part}.pdf`.replace(/[\\/:*?"<>|]/g,"");
    await saveFile(fname,blob);say("已產生 PDF："+fname,"ok");
  }catch(err){const c=err&&err.code;say(c==="declined"?"已取消下載":c==="rate_limited"?"已有一個下載視窗開啟，請先處理後再試":c==="nodl"?"這個檢視無法下載檔案。請在 claude.ai 中開啟此頁再匯出。":"產生 PDF 時發生問題，請再試一次","bad");}
  finally{btn.disabled=false;btn.textContent=old;}
}
/* 下載：在 claude.ai 用 downloads 能力，其他網站（GitHub Pages）用一般下載 */
async function saveFile(name,blob){
  if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(!dl)throw {code:"nodl"};return dl.save({filename:name,data:blob});}
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function saveJSON(btn){const msg=$("#x-msg");
  try{await saveFile(`ADL_IADL評估單作答檔_${S.assessor||"學生"}.json`,new Blob([JSON.stringify(S)],{type:"application/json"}));msg.textContent="已下載作答檔";msg.className="msg ok";}
  catch(err){msg.textContent=err&&err.code==="declined"?"已取消下載":err&&err.code==="nodl"?"這個檢視無法下載檔案。":"下載失敗，請再試一次";msg.className="msg bad";}}

renderForm();
setMode(UI.mode==="learn"?"learn":"form");
const hh=location.hash.slice(1);if(T[hh]){setMode("learn");setTimeout(()=>{const el=document.getElementById(hh);if(el)el.scrollIntoView();},50);}
