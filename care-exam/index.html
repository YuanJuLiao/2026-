<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照顧服務員檢定練習</title>
<meta name="description" content="照顧服務員單一級技術士技能檢定：學科題庫練習、模擬考、錯題本與術科步驟自我檢核。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem('ce_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);var f=localStorage.getItem('ce_font');if(f)document.documentElement.setAttribute('data-font',f);}catch(e){}})();
</script>
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#efece5; --ink:#1f2a2c; --ink-2:#55605f; --line:#dcd7cc;
  --brand:#0f6f68; --brand-ink:#ffffff; --brand-soft:#dcefeb;
  --ok:#1d7a3e; --ok-soft:#e1f2e6; --bad:#b3261e; --bad-soft:#fbe6e4; --warn:#8a5a00; --warn-soft:#fbf0d9;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a1b; --surface:#1d2526; --surface-2:#252f30; --ink:#e8ecea; --ink-2:#a6b1af; --line:#334042;
    --brand:#4fbfb3; --brand-ink:#0d1a19; --brand-soft:#1f3836;
    --ok:#6fd08f; --ok-soft:#1c3324; --bad:#ff8a80; --bad-soft:#3a2120; --warn:#f2c46b; --warn-soft:#3a3020;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141a1b; --surface:#1d2526; --surface-2:#252f30; --ink:#e8ecea; --ink-2:#a6b1af; --line:#334042;
  --brand:#4fbfb3; --brand-ink:#0d1a19; --brand-soft:#1f3836;
  --ok:#6fd08f; --ok-soft:#1c3324; --bad:#ff8a80; --bad-soft:#3a2120; --warn:#f2c46b; --warn-soft:#3a3020;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
:root[data-font="s"]{--fs:15px}
:root[data-font="m"]{--fs:17px}
:root[data-font="l"]{--fs:21px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .dot{width:22px;height:22px;border-radius:6px;background:var(--brand);display:inline-grid;place-items:center;color:var(--brand-ink);font-size:.75rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 11px;font-size:.82rem;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg .a1{font-size:.75rem}.seg .a2{font-size:.9rem}.seg .a3{font-size:1.08rem}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink-2);min-height:40px}
nav.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand)}
main{padding:18px 0 60px}
h2{font-size:1.25rem;margin:.2em 0 .5em}
h3{font-size:1.05rem;margin:1.2em 0 .5em}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.grp-title{font-size:.85rem;color:var(--ink-2);margin:14px 0 6px;font-weight:700;letter-spacing:.05em}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;min-height:56px}
.cat[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.cat .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:.75rem;color:var(--brand-ink)}
.cat[aria-pressed="true"] .box{background:var(--brand);border-color:var(--brand)}
.cat .nm{font-weight:500;line-height:1.3}
.cat .meta{font-size:.75rem;color:var(--ink-2)}
.prog{height:4px;background:var(--surface-2);border-radius:4px;margin-top:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;min-height:36px;font-size:.85rem}
label.opt{display:inline-flex;align-items:center;gap:6px}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:40px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tag.del{background:var(--warn-soft);color:var(--warn)}
.qtext{font-size:1.1rem;font-weight:500;margin:0 0 14px}
.qimg{max-width:180px;max-height:180px;display:block;margin:0 0 12px;border-radius:8px;background:#fff;padding:6px}
.opts{display:grid;gap:8px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;cursor:pointer;min-height:48px;width:100%}
.op:hover:not(:disabled){border-color:var(--brand)}
.op .k{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.85rem;font-weight:700;margin-top:1px}
.op img{max-height:90px;max-width:120px;background:#fff;border-radius:6px;padding:4px}
.op.sel{border-color:var(--brand);background:var(--brand-soft)}
.op.right{border-color:var(--ok);background:var(--ok-soft)}
.op.right .k{background:var(--ok);color:#fff}
.op.wrong{border-color:var(--bad);background:var(--bad-soft)}
.op.wrong .k{background:var(--bad);color:#fff}
.op:disabled{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.bigscore{font-size:2.6rem;font-weight:700;line-height:1.1}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}
.grid-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.grid-nums button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;cursor:pointer;font-size:.8rem;min-height:36px}
.grid-nums button.done{background:var(--brand-soft);border-color:var(--brand)}
.grid-nums button.cur{outline:2px solid var(--brand)}
.grid-nums button.w{background:var(--bad-soft);border-color:var(--bad)}
.grid-nums button.r{background:var(--ok-soft);border-color:var(--ok)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.list .item{border-top:1px solid var(--line);padding:12px 0}
.list .item:first-child{border-top:0}
.empty{text-align:center;padding:30px 10px;color:var(--ink-2)}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.set{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.set[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.set b{font-size:1.1rem}
.tlist{display:grid;gap:8px}
.titem{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.titem .no{font-weight:700;color:var(--brand);margin-right:8px}
.case{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:10px 0}
.zero{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.zero b{color:var(--warn)}
.sec{margin-top:16px}
.sec h4{margin:0 0 6px;font-size:.98rem;display:flex;justify-content:space-between;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-top:1px dashed var(--line);cursor:pointer}
.step:first-of-type{border-top:0}
.step input{width:22px;height:22px;margin-top:3px;accent-color:var(--brand);flex:0 0 auto}
.step .tx{flex:1}
.step .pt{flex:0 0 auto;font-size:.8rem;color:var(--ink-2);white-space:nowrap}
.step.hide .tx{color:transparent;background:var(--surface-2);border-radius:6px;user-select:none}
.step.hide .tx{position:relative;min-height:2.2em}
.step.hide .tx::after{content:"點一下顯示步驟";color:var(--ink-2);font-size:.85rem;position:absolute;left:10px;top:50%;transform:translateY(-50%);white-space:nowrap}
.sticky-score{position:sticky;bottom:10px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.voice{border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:12px;padding:12px 14px;margin:12px 0}
.voice .vt{background:var(--surface);border-radius:8px;padding:8px 10px;min-height:2.6em;margin-top:8px;font-size:.9rem;color:var(--ink-2);max-height:9em;overflow:auto}
.voice textarea{width:100%;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink);min-height:4em;margin-top:8px}
.mic{display:inline-flex;align-items:center;gap:6px}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.mic.on::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.step.voiced .pt::before{content:"🎤 ";}
.step.voiced{background:var(--ok-soft);border-radius:8px}
.missed{background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:.9rem}
.missed ol{margin:4px 0 0;padding-left:1.3em}
footer{border-top:1px solid var(--line);padding:18px 0 30px;font-size:.8rem;color:var(--ink-2)}
.hidden{display:none!important}
@media (max-width:520px){
  .sets{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr)}
  .bigscore{font-size:2.1rem}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><span class="dot">照</span>照顧服務員檢定練習</div>
      <div class="seg" role="group" aria-label="背景">
        <button data-theme-btn="auto" title="跟隨系統">自動</button>
        <button data-theme-btn="light">淺色</button>
        <button data-theme-btn="dark">深色</button>
      </div>
      <div class="seg" role="group" aria-label="字體大小">
        <button class="a1" data-font-btn="s">小</button>
        <button class="a2" data-font-btn="m">中</button>
        <button class="a3" data-font-btn="l">大</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="practice">學科練習</button>
      <button role="tab" data-tab="exam">模擬考</button>
      <button role="tab" data-tab="wrong">錯題本</button>
      <button role="tab" data-tab="tech">術科練習</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-practice"></section>
  <section id="v-exam" class="hidden"></section>
  <section id="v-wrong" class="hidden"></section>
  <section id="v-tech" class="hidden"></section>
</main>

<footer class="wrap">
  <div id="srcnote"></div>
  <div style="margin-top:6px">題目與答案依勞動部勞動力發展署技能檢定中心公告之參考資料；每題解析為教學補充說明，若與最新法規或公告不同，以官方資料為準。作答紀錄只存在本裝置的瀏覽器中。</div>
</footer>

<script src="data.js"></script>
<script src="voice-keys.js"></script>
<script>
(function(){
'use strict';
var D=window.CARE_DATA, QS=D.qs, CATS=D.cats;
var KEYS='①②③④';

/* ---------- storage ---------- */
function load(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var stats=load('ce_stats',{});   // idx -> [tries, correct]
var wrongs=load('ce_wrong',{});  // idx -> count
function record(i,ok){
  var s=stats[i]||[0,0]; s[0]++; if(ok)s[1]++; stats[i]=s; save('ce_stats',stats);
  if(!ok){wrongs[i]=(wrongs[i]||0)+1;}
  save('ce_wrong',wrongs);
}

/* ---------- theme & font ---------- */
var root=document.documentElement;
function setTheme(t){ if(t==='auto'){root.removeAttribute('data-theme');try{localStorage.removeItem('ce_theme')}catch(e){}} else {root.setAttribute('data-theme',t);try{localStorage.setItem('ce_theme',t)}catch(e){}} syncSeg(); }
function setFont(f){ root.setAttribute('data-font',f); try{localStorage.setItem('ce_font',f)}catch(e){} syncSeg(); }
function syncSeg(){
  var t=root.getAttribute('data-theme')||'auto', f=root.getAttribute('data-font')||'m';
  document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.themeBtn===t)});
  document.querySelectorAll('[data-font-btn]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.fontBtn===f)});
}
document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.onclick=function(){setTheme(b.dataset.themeBtn)}});
document.querySelectorAll('[data-font-btn]').forEach(function(b){b.onclick=function(){setFont(b.dataset.fontBtn)}});
syncSeg();

/* ---------- tabs ---------- */
var curTab='practice';
function showTab(t){
  curTab=t; if(t!=='tech'&&typeof stopRec==='function')stopRec();
  document.querySelectorAll('[data-tab]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===t)});
  ['practice','exam','wrong','tech'].forEach(function(v){document.getElementById('v-'+v).classList.toggle('hidden',v!==t)});
  try{localStorage.setItem('ce_tab',t)}catch(e){}
  if(t==='practice'&&!P.active)renderPracticeHome();
  if(t==='wrong'&&!W.active)renderWrongHome();
  if(t==='exam'&&!X.active&&!X.done)renderExamHome();
  if(t==='tech'&&!T.cur)renderTechHome();
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){showTab(b.dataset.tab)}});

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function catLabel(c){var x=CATS[c];return x.code+' '+x.name;}
function el(id){return document.getElementById(id)}

/* question card (shared) */
function qCard(i,opts){
  // opts: {pos,total,chosen,reveal,onPick,headExtra}
  var q=QS[i], h='';
  h+='<div class="card"><div class="qhead"><span>'+(opts.pos!=null?'第 '+(opts.pos+1)+' / '+opts.total+' 題':'')+'</span><span><span class="tag">'+esc(catLabel(q.c))+' 第'+q.n+'題</span>'+(q.d?' <span class="tag del">官方已刪題</span>':'')+'</span></div>';
  h+='<p class="qtext">'+esc(q.q)+'</p>';
  if(q.img)h+='<img class="qimg" src="'+q.img+'" alt="題目圖示">';
  h+='<div class="opts">';
  for(var k=1;k<=4;k++){
    var cls='op';
    if(opts.reveal){ if(k===q.a)cls+=' right'; else if(k===opts.chosen)cls+=' wrong'; }
    else if(k===opts.chosen)cls+=' sel';
    var body=q.oi?'<img src="'+q.oi[k-1]+'" alt="選項'+k+'圖示">':esc(q.o[k-1]);
    h+='<button class="'+cls+'" data-k="'+k+'"'+(opts.reveal?' disabled':'')+'><span class="k">'+k+'</span><span>'+body+'</span></button>';
  }
  h+='</div>';
  if(opts.reveal){
    var ok=opts.chosen===q.a;
    h+='<div class="fb '+(ok?'ok':'no')+'"><b>'+(opts.chosen==null?'正確答案：'+KEYS[q.a-1]:(ok?'答對了！':'答錯了，正確答案是 '+KEYS[q.a-1]))+'</b>'+esc(q.e)+'</div>';
  }
  h+='</div>';
  return h;
}
function bindOpts(container,fn){container.querySelectorAll('.op').forEach(function(b){b.onclick=function(){fn(+b.dataset.k)}})}

/* ================= PRACTICE ================= */
var P={active:false,sel:load('ce_sel',[0]),order:load('ce_order','seq'),count:load('ce_count','20'),onlyNew:false};
function catProgress(c){
  var tot=0,done=0,right=0;
  QS.forEach(function(q,i){if(q.c===c){tot++;if(stats[i]){done++;if(stats[i][1]>0)right++;}}});
  return {tot:tot,done:done,right:right};
}
function renderPracticeHome(){
  var v=el('v-practice');
  var h='<h2>學科練習</h2><p class="muted small">選擇要練習的類別（可複選），每題作答後立即顯示對錯與解析。</p>';
  ['專業科目','共同科目'].forEach(function(g){
    h+='<div class="grp-title">'+g+(g==='共同科目'?'（90006–90009）':'（17800 照顧服務員）')+'</div><div class="cats">';
    CATS.forEach(function(c,ci){ if(c.grp!==g)return;
      var p=catProgress(ci), on=P.sel.indexOf(ci)>=0;
      h+='<button class="cat" data-c="'+ci+'" aria-pressed="'+on+'"><span class="box">'+(on?'✓':'')+'</span><span style="flex:1"><span class="nm">'+(g==='專業科目'?'工作項目'+String(ci+1).padStart(2,'0')+' ':'')+esc(c.name)+'</span><div class="meta">'+c.n+' 題・已練 '+p.done+'</div><div class="prog"><i style="width:'+(p.done/p.tot*100)+'%"></i></div></span></button>';
    });
    h+='</div>';
  });
  h+='<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="selPro">全選專業</button><button class="btn sm ghost" id="selCom">全選共同</button><button class="btn sm ghost" id="selAll">全部</button><button class="btn sm ghost" id="selNone">清除</button></div>';
  h+='<div class="card" style="margin-top:14px"><div class="row">';
  h+='<label class="opt">順序 <select id="pOrder"><option value="seq">依題號</option><option value="rand">隨機</option></select></label>';
  h+='<label class="opt">題數 <select id="pCount"><option>10</option><option>20</option><option>50</option><option value="all">全部</option></select></label>';
  h+='<label class="opt"><input type="checkbox" id="pNew"> 只練沒做過的</label>';
  h+='</div><div class="row" style="margin-top:12px"><button class="btn primary" id="pStart">開始練習</button><span class="muted small" id="pInfo"></span></div></div>';
  v.innerHTML=h;
  el('pOrder').value=P.order; el('pCount').value=P.count; el('pNew').checked=P.onlyNew;
  v.querySelectorAll('.cat').forEach(function(b){b.onclick=function(){var c=+b.dataset.c,ix=P.sel.indexOf(c);if(ix>=0)P.sel.splice(ix,1);else P.sel.push(c);save('ce_sel',P.sel);renderPracticeHome();}});

var X={active:false,done:false,timer:null};
function buildExam(){
  var proCats=[0,1,2,3,4,5], comCats=[6,7,8,9];
  var avail=function(c){return QS.map(function(q,i){return i}).filter(function(i){return QS[i].c===c&&!QS[i].d})};
  var sizes=proCats.map(function(c){return avail(c).length}), tot=sizes.reduce(function(a,b){return a+b},0);
  var raw=sizes.map(function(s){return s/tot*64}), base=raw.map(Math.floor), rem=64-base.reduce(function(a,b){return a+b},0);
  raw.map(function(r,i){return [r-Math.floor(r),i]}).sort(function(a,b){return b[0]-a[0]}).slice(0,rem).forEach(function(x){base[x[1]]++});
  var list=[];
  proCats.forEach(function(c,k){list=list.concat(shuffle(avail(c)).slice(0,base[k]))});
  comCats.forEach(function(c){list=list.concat(shuffle(avail(c)).slice(0,4))});
  return list;
}

    if(t.id==='06'){ // A/B 擇一：只取較高的那一段
      var a=0,b=0;t.secs.forEach(function(s,sx){var tot=0;s.items.forEach(function(it,ix){if(T.chk[sx+'-'+ix])tot+=it[1]});if(s.h.indexOf('情況A')>=0)a=tot;if(s.h.indexOf('情況B')>=0)b=tot;});
      sc=sc-a-b+Math.max(a,b);
    }
    var e=el('tScore');e.textContent=sc;e.className=sc>=60?'pass':'';
    return sc;
  }
  calc();
  v.querySelectorAll('.step input').forEach(function(c){c.onchange=function(){T.chk[c.dataset.c]=c.checked;calc()}});
  v.querySelectorAll('.step.hide').forEach(function(s){s.addEventListener('click',function(e){if(s.classList.contains('hide')){e.preventDefault();s.classList.remove('hide');T.chk['r'+s.dataset.key]=true;}})});
  el('tHide').onchange=function(){stopRec();T.hide=this.checked;Object.keys(T.chk).forEach(function(k){if(k[0]==='r')delete T.chk[k]});renderTech()};
  el('tBack').onclick=function(){stopRec();T.cur=null;renderTechHome()};
  el('tReset').onclick=function(){stopRec();T.chk={};T.heard={};T.transcript='';renderTech()};
  /* ---- voice check ---- */
  var KEYS=(window.VOICE_KEYS||{})[t.id]||[];
  function norm(s){return String(s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).replace(/[\s，。、！？：；,.!?:;「」『』（）()～~\-—]/g,'').toLowerCase();}
  function hit(txt,rule){return rule.split('&').every(function(g){return g.split('|').some(function(alt){return txt.indexOf(norm(alt))>=0})})}
  var heard=T.heard||{}; T.heard=heard;
  function applyText(raw){
    var txt=norm(raw); if(!txt)return;
    KEYS.forEach(function(sec,sx){(sec||[]).forEach(function(rule,ix){
      var key=sx+'-'+ix; if(heard[key]||!rule)return;
      if(hit(txt,rule)){heard[key]=1;T.chk[key]=true;T.chk['r'+key]=true;
        var lab=v.querySelector('.step[data-key="'+key+'"]');
        if(lab){lab.classList.remove('hide');lab.classList.add('voiced');lab.querySelector('input').checked=true;}
      }
    })});
    calc();
  }
  function showMissed(){
    var miss=[];
    t.secs.forEach(function(s,sx){
      if(t.id==='06'&&(s.h.indexOf('情況')>=0)){ // 只看講得較多的那一種情況
        var other=t.secs.filter(function(z){return z.h.indexOf('情況')>=0&&z!==s})[0], ox=t.secs.indexOf(other);
        var mine=s.items.filter(function(_,ix){return heard[sx+'-'+ix]}).length, theirs=other.items.filter(function(_,ix){return heard[ox+'-'+ix]}).length;
        if(mine<theirs||(mine===theirs&&s.h.indexOf('情況B')>=0))return;
      }
      s.items.forEach(function(it,ix){if(!heard[sx+'-'+ix])miss.push('【'+s.h.replace(/（.*）/,'')+'】'+it[0])});
    });
    var box=el('vMissed');
    if(!Object.keys(heard).length){box.innerHTML='';return;}
    box.innerHTML=miss.length?'<div class="missed"><b>還沒講到的步驟（'+miss.length+' 項）</b>'+(T.hide?'<div class="small muted">點下方被遮住的步驟可以看答案</div>':'<ol>'+miss.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ol>')+'</div>':'<div class="missed" style="background:var(--ok-soft)"><b>所有步驟都講到了！</b></div>';
  }
  Object.keys(heard).forEach(function(key){var lab=v.querySelector('.step[data-key="'+key+'"]');if(lab)lab.classList.add('voiced')});
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=el('vMic'), vt=el('vText');
  if(T.transcript)vt.textContent=T.transcript;
  if(!SR){mic.disabled=true;mic.textContent='此瀏覽器不支援語音';vt.textContent='這個瀏覽器不支援語音辨識。請用手機的 Chrome 或 Safari、電腦的 Chrome 或 Edge 開啟（LINE、Facebook 內建瀏覽器不支援）；也可以按「改用打字」。';}
  mic.onclick=function(){
    if(T.rec){T.listening=false;try{T.rec.stop()}catch(e){};return;}
    var rec=new SR(); rec.lang='zh-TW'; rec.continuous=true; rec.interimResults=true;
    T.rec=rec; T.listening=true; T.transcript=T.transcript||''; var base=T.transcript;
    mic.classList.add('on'); mic.textContent='停止';
    rec.onresult=function(e){var fin='',tmp='';for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript;}
      if(fin){T.transcript+=fin+' ';applyText(fin);}
      if(tmp)applyText(tmp);
      vt.textContent=(T.transcript+tmp)||'…';vt.scrollTop=vt.scrollHeight;};
    rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){T.listening=false;vt.textContent='無法使用麥克風：請允許這個網頁使用麥克風後再試一次。';}};
    rec.onend=function(){ if(T.listening&&T.rec===rec){try{rec.start();return;}catch(e){}} T.rec=null;T.listening=false;mic.classList.remove('on');mic.textContent='開始口述';applyText(T.transcript);showMissed();};
    try{rec.start();vt.textContent='請開始說…';}catch(e){vt.textContent='無法啟動語音辨識：'+e.message;}
  };
  el('vType').onclick=function(){el('vTypeBox').classList.toggle('hidden')};
  el('vCheck').onclick=function(){var s=el('vInput').value;T.transcript=(T.transcript||'')+s+' ';vt.textContent=T.transcript;applyText(s);showMissed();};
  showMissed();
  el('tSave').onclick=function(){var sc=calc();var b=load('ce_tbest',{});if(b[t.id]==null||sc>b[t.id])b[t.id]=sc;save('ce_tbest',b);this.textContent='已記錄 '+sc+' 分';};
}

/* ---------- init ---------- */
el('srcnote').textContent='題庫版本：學科 '+D.ver['17800']+'；共同科目 '+D.ver['90006']+'、'+D.ver['90007']+'、'+D.ver['90008']+'、'+D.ver['90009']+'；術科 '+D.ver.tech+'。';
var startTab='practice';try{var st=localStorage.getItem('ce_tab');if(st&&['practice','exam','wrong','tech'].indexOf(st)>=0)startTab=st;}catch(e){}
showTab(startTab);
})();
</script>
