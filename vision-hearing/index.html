<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>視力與聽力評估實作</title>
<meta name="description" content="亞洲大學長期照護學系 高齡周全性健康評估與實作 第5週：視力與聽力評估教材與評估單實作">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky header with two modes (學習 / 評估單); 評估單 = unit rail on the left + item cards, one item answered after another. */
:root{
  --paper:#F3F6F6; --surface:#FFFFFF; --sunk:#E9EFEF; --ink:#14232B; --muted:#56676E; --line:#D3DDDF;
  --accent:#0E6767; --accent-ink:#FFFFFF; --accent-soft:#DDEFEE;
  --vision:#A84C0A; --vision-soft:#FBEADB; --hearing:#2A5BA6; --hearing-soft:#E2EBF8;
  --ok:#2C7A47; --ok-soft:#E1F1E6; --warn:#B3261E; --warn-soft:#FBE4E1;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1618; --surface:#162125; --sunk:#1C2A2F; --ink:#E3ECEE; --muted:#93A6AC; --line:#2B3B40;
  --accent:#5EC3BE; --accent-ink:#06201F; --accent-soft:#163533;
  --vision:#F0A262; --vision-soft:#3A2617; --hearing:#91B5F2; --hearing-soft:#1A2A43;
  --ok:#73C98F; --ok-soft:#173225; --warn:#F28B82; --warn-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1618; --surface:#162125; --sunk:#1C2A2F; --ink:#E3ECEE; --muted:#93A6AC; --line:#2B3B40;
  --accent:#5EC3BE; --accent-ink:#06201F; --accent-soft:#163533;
  --vision:#F0A262; --vision-soft:#3A2617; --hearing:#91B5F2; --hearing-soft:#1A2A43;
  --ok:#73C98F; --ok-soft:#173225; --warn:#F28B82; --warn-soft:#3B1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.brand h1{font-size:19px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:progress}
.progress{height:3px;background:var(--sunk)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* learn */
.learn{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding-block:24px 60px}
.toc{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:14px}
.toc h4{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.toc a{color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:6px;border-left:3px solid transparent}
.toc a:hover{background:var(--sunk)}
.toc a.v{border-left-color:var(--vision)} .toc a.h{border-left-color:var(--hearing)} .toc a.a{border-left-color:var(--accent)}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:12px}
.intro h2{font-size:24px}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{background:var(--sunk);border-radius:8px;padding:8px 14px;min-width:150px}
.fact b{font-family:var(--f-mono);font-size:22px;display:block}
.fact span{font-size:13px;color:var(--muted)}
.topic{padding-block:28px 8px;border-bottom:1px solid var(--line);display:grid;gap:12px;scroll-margin-top:90px}
.topic .tag{font-size:12px;letter-spacing:.08em;font-weight:500}
.topic.v .tag{color:var(--vision)} .topic.h .tag{color:var(--hearing)} .topic.a .tag{color:var(--accent)}
.topic h3{font-size:21px}
.prose{max-width:68ch}
.prose p{margin:0 0 .6em}
.prose ul,.prose ol{margin:0 0 .6em;padding-left:1.3em}
.prose li{margin:.15em 0}
.prose b{font-weight:700}
.prose .flow{font-size:14px;background:var(--sunk);padding:10px 14px;border-radius:8px}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
figure img{display:block;width:100%;height:auto;cursor:zoom-in;background:#fff}
figure figcaption{font-size:12px;color:var(--muted);padding:6px 10px}
table.mini{border-collapse:collapse;font-size:14px;width:100%}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.mini th{background:var(--sunk);font-weight:500}
.tbl{overflow-x:auto}
.amsler{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.amsler svg{width:220px;max-width:100%;height:auto;background:var(--surface);border:1px solid var(--line)}
.amsler .prose{flex:1 1 240px}

/* form */
.form{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:22px 80px}
.rail{position:sticky;top:90px;align-self:start;display:flex;flex-direction:column;gap:6px}
.unit-btn{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;text-align:left;border:1px solid transparent;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.unit-btn:hover{background:var(--sunk)}
.unit-btn[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.unit-btn .k{grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;background:var(--sunk);color:var(--muted)}
.unit-btn[data-dom="v"] .k{background:var(--vision-soft);color:var(--vision)}
.unit-btn[data-dom="h"] .k{background:var(--hearing-soft);color:var(--hearing)}
.unit-btn .t{font-weight:500;font-size:14px}
.unit-btn .c{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.unit-btn.done .c{color:var(--ok)}
.rail .opt{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:10px;padding:0 10px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;gap:4px;margin-bottom:18px}
.case b{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.unit-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin-bottom:6px}
.unit-head h2{font-size:24px}
.unit-head .meta{font-size:13px;color:var(--muted)}
.sec{margin-top:26px}
.sec>h3{font-size:16px;font-family:var(--f-body);font-weight:700;padding-bottom:6px;border-bottom:2px solid var(--line);margin-bottom:12px;display:flex;gap:10px;align-items:baseline}
.sec>h3 span{font-size:12px;color:var(--muted);font-weight:400}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;scroll-margin-top:110px;transition:border-color .2s}
.item.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.item .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.item.ok .dot{background:var(--ok);border-color:var(--ok)}
.item.ok .dot::after{content:"";width:8px;height:4px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.item .body{display:grid;gap:8px;min-width:0}
.item .lbl{font-weight:500}
.item .lbl em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.hint{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}
.hint ol,.hint ul{margin:0;padding-left:1.3em}
.learnlink{justify-self:start;border:0;background:transparent;color:var(--accent);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea,select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px}
textarea{min-height:76px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;background:var(--paper);font-size:14px}
.choice input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.choice.sq span{border-radius:6px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline input[type=text]{flex:1 1 180px;width:auto}
.quick{display:flex;gap:6px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ear{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;background:var(--paper)}
.ear h5{margin:0;font-size:14px}
.ear .row{display:grid;gap:4px}
.ear .row small{color:var(--muted)}
.res{font-size:13.5px;border-radius:8px;padding:8px 12px;background:var(--sunk)}
.res.ok{background:var(--ok-soft);color:var(--ok)}
.res.bad{background:var(--warn-soft);color:var(--warn)}
.note{border-radius:var(--r);padding:12px 16px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.note.bad{border-color:var(--warn);background:var(--warn-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note>b{display:block;margin-bottom:2px}
.note ol{margin:4px 0 0;padding-left:1.3em}
.icope{display:grid;gap:10px}
.icope .grp{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.icope .grp>b{font-size:13px;letter-spacing:.06em}
.icope .grp.bad>b{color:var(--warn)} .icope .grp.ok>b{color:var(--ok)}
.icope .r{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
@media (max-width:520px){.icope .r{grid-template-columns:1fr}}
.tree-img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.unit-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.unit-foot .grow{display:flex;gap:8px;flex-wrap:wrap}
.nextfab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mob-units{display:none}

/* drawer + modal + lightbox */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:41;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,calc(env(safe-area-inset-right,0px) + 20px)) calc(env(safe-area-inset-bottom,0px) + 30px) 20px;box-shadow:-6px 0 24px rgba(0,0,0,.2)}
.drawer .close{position:sticky;top:0;float:right}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:12px;z-index:41;padding:20px 22px;display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{font-size:19px}
.modal label.row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.msg{font-size:13.5px;color:var(--muted)}
.msg.bad{color:var(--warn)} .msg.ok{color:var(--ok)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,10,12,.88);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;z-index:60;font-size:14px}

#report{position:fixed;left:-12000px;top:0;width:760px}

@media (max-width:900px){
  .learn,.form{grid-template-columns:minmax(0,1fr)}
  .toc,.rail{display:none}
  .mob-units{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .mob-units .unit-btn{flex:0 0 auto;grid-template-columns:24px auto;background:var(--surface);border-color:var(--line)}
  .mob-units .unit-btn .k{width:24px;height:24px;font-size:12px}
  .mob-units .unit-btn[aria-current="true"]{border-color:var(--accent)}
  .item{grid-template-columns:1fr}
  .item .no{flex-direction:row;align-items:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* report (PDF) - fixed light print palette */
.rp{font-family:var(--f-body);color:#111;background:#fff;font-size:13px;line-height:1.6;padding:0}
.rp-block{background:#fff;padding:4px 0}
.rp h1{font-family:var(--f-display);font-size:20px;text-align:center;margin:0 0 2px}
.rp .sub{text-align:center;font-size:12px;color:#444;margin-bottom:8px}
.rp h2{font-family:var(--f-display);font-size:16px;margin:6px 0 4px;padding:4px 8px;background:#E8EEEE;border-left:4px solid #0E6767}
.rp h2.v{border-left-color:#A84C0A} .rp h2.h{border-left-color:#2A5BA6}
.rp table{width:100%;border-collapse:collapse;table-layout:fixed}
.rp td,.rp th{border:1px solid #888;padding:5px 7px;vertical-align:top;word-break:break-word;white-space:pre-wrap}
.rp th{background:#F1F4F4;font-weight:700;text-align:left}
.rp td.k{width:30%;background:#FAFBFB}
.rp .empty{color:#999}
.rp .sect{font-weight:700;background:#F1F4F4}
.rp img{max-width:100%;max-height:420px}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ============ 教材內容（取自課堂簡報） ============ */
const TOPICS = [
 {id:"v-structure",dom:"v",group:"視力",title:"眼睛結構",imgs:[["s3","眼睛的附屬構造"],["s4","眼球構造"]],html:`
  <div class="tbl"><table class="mini"><tr><th>部位</th><th>構造</th><th>功能</th></tr>
  <tr><td>外膜</td><td>角膜、鞏膜（眼白）</td><td>保護作用；角膜透明、無血管但有感覺神經</td></tr>
  <tr><td>中膜</td><td>虹膜、睫狀體、脈絡膜</td><td>保護及血液營養供應；虹膜收縮程度決定瞳孔大小</td></tr>
  <tr><td>內膜（視網膜）</td><td>虹膜部、睫狀體部（盲部）、視部</td><td>視覺作用</td></tr>
  <tr><td>內容物</td><td>眼房水、水晶體、玻璃體</td><td>屈光、提供營養及支持作用</td></tr></table></div>
  <ul><li><b>水晶體</b>：屈光作用，負責將光線聚焦在視網膜。</li>
  <li><b>視網膜</b>：錐細胞（Cones）辨識彩色（紅、藍、綠），桿細胞（Rods）辨識黑白；含視紫質（需維生素 A）。</li>
  <li><b>黃斑部</b>：負責中心視力、顏色辨識和精細視覺。</li></ul>`},
 {id:"v-aqueous",dom:"v",group:"視力",title:"眼房水製造與循環",imgs:[["s6","眼房水循環路徑"]],html:`
  <p>眼房水（水樣液）的功能：屈光、提供眼部營養、維持眼部形狀。</p>
  <p class="flow">睫狀突分泌眼房水 → 後房 → 瞳孔 → 前房 → 虹膜角膜的小樑間隙 → 許萊姆氏管（Canal of Schlemm） → 鞏膜 → 眼靜脈 → 體循環</p>
  <p>流通管道受阻或眼房水分泌過多時，眼內壓升高，造成<b>青光眼</b>，視力受損。正常眼壓為 <b>10～20 mmHg</b>。</p>`},
 {id:"v-pathway",dom:"v",group:"視力",title:"眼睛如何看見東西",imgs:[["s9","視覺傳導路徑"]],html:`
  <p class="flow">光線 → 角膜 → 前眼房 → 水晶體 → 玻璃體 → 網膜內層 → 網膜外層 → 錐細胞和桿細胞受激發 → 雙極神經元細胞 → 神經節細胞 → 視神經 → 視交叉（鼻側交叉，顳側不交叉） → 視束 → 視丘外側膝狀體 → 視放射 → 大腦枕葉視覺皮質（第 17 區）</p>`},
 {id:"v-aging",dom:"v",group:"視力",title:"年長者視力變化與常見眼疾",imgs:[["s12","老年環與黃斑瘤"]],html:`
  <p><b>視力變化</b>：視力下降、視野縮小、對光暗對比的適應速度變慢，因此<b>跌倒風險增加</b>。</p>
  <p><b>常見眼睛疾病</b>：屈光不正、白內障、青光眼、黃斑部病變。</p>
  <p>視診時也可能看到角膜老年環（角膜周邊灰白環）與黃斑瘤（眼瞼內側黃色斑塊）。</p>`},
 {id:"v-refraction",dom:"v",group:"視力",title:"屈光不正",imgs:[["s13","正視、近視、遠視與老花"]],html:`
  <ul><li><b>近視</b>：影像落在視網膜之前。</li><li><b>遠視</b>：影像落在視網膜之後。</li><li><b>散光</b></li><li><b>老花</b>：水晶體隨年齡硬化、調節力下降，看近困難。</li></ul>`},
 {id:"v-cataract",dom:"v",group:"視力",title:"白內障",imgs:[["s14","正常與白內障眼睛"]],html:`
  <p><b>定義</b>：水晶體原本清澈透明，隨年齡增長逐漸變混濁，阻擋光線透過，造成視覺模糊。白內障不是「有或沒有」，而是看「熟」的程度（就像蒸雞蛋）。</p>
  <p><b>成因與危險因子</b>：老化、外傷、先天性、藥物（類固醇藥水）、併發性（青光眼、高度近視、視網膜色素病變）、藍光、代謝型疾病。</p>`},
 {id:"v-glaucoma",dom:"v",group:"視力",title:"青光眼",imgs:[["s16","青光眼眼房水阻塞示意"]],html:`
  <p><b>定義</b>：眼睛內的視神經逐漸退化，失去<b>周邊視力</b>。</p>
  <ol><li>眼壓偏高：長期眼壓偏高是最直接的因素。</li><li>年長者，且女性多於男性。</li><li>罹患糖尿病、經常偏頭痛或有血管痙攣症候群者。</li><li>逾 600 度高度近視或高度遠視者。</li><li>長期使用類固醇者。</li><li>有青光眼家族病史者。</li></ol>`},
 {id:"v-amd",dom:"v",group:"視力",title:"黃斑部病變與阿姆斯勒方格表",imgs:[["s17","黃斑部病變與阿姆斯勒方格表"]],amsler:true,html:`
  <p><b>定義</b>：黃斑部結構的衰老性改變，出現視力模糊或<b>中央視野</b>障礙。</p>
  <ol><li>50 歲以上之成年人及長者</li><li>有抽菸習慣者</li><li>患有高血壓、高血脂或糖尿病者</li><li>家族有黃斑部病變者</li></ol>`},
 {id:"v-care",dom:"v",group:"視力",title:"處置視力減退及維護視力",imgs:[["s21","處置建議"],["s23","白手杖安全日"]],html:`
  <p>視覺功能需考量環境和個人因素。照明度、對比度、顏色可促進視覺功能；長時間看電子螢幕、長時間看近則會造成傷害。</p>
  <ul><li><b>改善照明</b>：光源最好來自側面，較不會產生陰影或刺激。</li>
  <li><b>減少眩光</b>：光線要明亮，但太強的陽光或光線會造成模糊不適。</li>
  <li><b>移除障礙物</b>：把傢俱和堅硬物品移出日常動線，物品盡量固定位置。</li>
  <li><b>提高對比色差</b>：臺階邊緣高對比標記、有色盤子、黑筆書寫、為家用與廚房工具手柄上色。</li>
  <li><b>使用最清晰的字體</b>：大型無襯線字體配合對比色背景。</li>
  <li><b>選擇大且高對比的物品</b>：大字鐘錶、大字本、大型棋盤與撲克牌。</li>
  <li><b>使用聽覺與視覺輔具</b>：語音手錶、血壓計、體溫計、體重計；手機文字轉語音。</li></ul>
  <p>每年 10 月 15 日為「白手杖安全日」。</p>`},
 {id:"h-structure",dom:"h",group:"聽力",title:"耳朵結構、骨導與氣導",imgs:[["s26","耳朵結構"],["s27","骨性傳導與空氣傳導"]],html:`
  <ul><li><b>骨性傳導（Bone Conduction, BC）</b>：聲波由顱骨傳至內耳。</li>
  <li><b>空氣傳導（Air Conduction, AC）</b>：聲波經空氣由外耳傳至中耳及內耳。</li></ul>
  <p><b>AC 較 BC 靈敏，正常時 AC 的傳導時間是 BC 的 2～3 倍。</b></p>`},
 {id:"h-loss",dom:"h",group:"聽力",title:"聽力喪失的類型",imgs:[["s28","三種聽力喪失"]],html:`
  <div class="tbl"><table class="mini"><tr><th>類型</th><th>部位</th><th>常見原因</th></tr>
  <tr><td>傳導性</td><td>外耳或中耳（鼓膜、三小聽骨）；BC&gt;AC</td><td>中耳炎、鼓膜穿孔、耳垢堵塞</td></tr>
  <tr><td>感覺神經性</td><td>內耳</td><td>突發性耳聾、老化、噪音傷害</td></tr>
  <tr><td>混合性</td><td>外耳、中耳或內耳</td><td>同時有傳導性與感覺神經性聽損</td></tr></table></div>`},
 {id:"h-tests",dom:"h",group:"聽力",title:"聽力測試與判讀",imgs:[["s45","聽力測試判讀樹"]],html:`
  <ul><li><b>耳語試驗</b>正常：兩耳情況一致，且能正確複誦所聽到的字句。</li>
  <li><b>滴答聲測試</b>正常：個案聽到的情形與一般人相同。</li></ul>
  <p><b>Weber's Test</b>（目的：確認有無聽力喪失，協助診斷）</p>
  <ul><li>正常：陰性反應，兩耳聽到的聲音一樣，聲音在中央。</li>
  <li>傳導性聽力喪失：<b>患耳較清楚</b>（外界干擾被阻隔）。</li>
  <li>感覺神經性聽力喪失：<b>患耳較不清楚</b>（健側耳聽得較大聲）。</li></ul>
  <p><b>Rinne's Test</b>（比較同一耳的 BC 與 AC 時間）</p>
  <ul><li>正常：AC &gt; BC（陽性）。</li>
  <li>陰性反應（−）：AC &lt; BC，BC 傳導時間較久 → <b>傳導性</b>聽力喪失。</li>
  <li>陽性反應（+）但 AC、BC 都不好：AC 仍較久 → <b>感覺神經性</b>聽力喪失。</li></ul>
  <p>測試時可問長者：「請問有聽到聲音嗎？」「哪一側比較大聲？」</p>`},
 {id:"h-care",dom:"h",group:"聽力",title:"定期檢查、輔具、溝通與資源",imgs:[["s30","聽力輔具"],["s32","資源連結"]],html:`
  <p><b>定期檢查</b>：每半年聽力檢查；每半年至一年至耳鼻喉科進行聽力等檢查；有急慢性症狀時至急診或門診就醫。</p>
  <p><b>輔具</b>：助聽器、擴音器、無線震動警示器。</p>
  <p><b>溝通技巧</b></p>
  <ol><li>把握「簡化」與「封閉式」原則，盡量以是非題或選擇題溝通，避免太開放的問題。</li>
  <li>先關掉電視、廣播等干擾，一次只溝通一件事情，避免內容跳躍或反覆。</li></ol>
  <p><b>資源連結</b></p>
  <ul><li><a href="https://healthhub.hpa.gov.tw/" target="_blank" rel="noopener">衛生福利部國民健康署 長者社區資源整合運用平台</a></li>
  <li><a href="https://www.mohw.gov.tw/cp-2636-21197-1.html" target="_blank" rel="noopener">長者需要關心、陪伴與聆聽（衛生福利部）</a></li></ul>`},
 {id:"a-history",dom:"a",group:"評估流程",title:"病史收集、視診與觸診",imgs:[["s39","眼瞼與耳殼觸診"]],html:`
  <p><b>現在病史</b>　眼睛：近視、遠視、散光或老花；是否用眼藥水或藥膏；乾澀、疼痛、畏光、發癢、異物感、不自主流淚；複視、飛蚊症、視力模糊、閃光感。耳：耳鳴、聽力障礙或喪失、頭暈、暈眩（天旋地轉）。</p>
  <p><b>過去病史</b>　眼睛：砂眼、睫毛倒插、青光眼、白內障或任何視覺障礙；住院開刀；糖尿病、高血壓等慢性病。耳：高血壓；耳部創傷或發炎、過敏性鼻炎；因耳部問題住院或開刀；是否使用耳毒性物質或藥物（影響耳蝸及前庭功能）。</p>
  <p><b>家族史</b>　耳：先天性聽障疾病（如先天性梅毒併發耳疾、梅尼爾氏症）；高血脂、高血壓等慢性病家族史。</p>
  <p><b>心理社會史</b>　職業；是否長期用眼、煙塵污染、高壓、空氣品質不良或需長期說話。<b>日常生活史</b>：飲食、吸菸、飲酒、高脂或辛辣飲食；是否使用助聽器、眼鏡或隱形眼鏡。</p>
  <p><b>視診</b>　眼球位置是否適當；眉毛、眼瞼、結膜、眼眶周圍顏色。兩耳大小與結構是否對稱、耳朵與臉的顏色、有無結節或病灶（畸形、腫塊、水腫、分泌物）。</p>
  <p><b>觸診</b>　個案頭不動、眼睛看下方，以食指指腹壓放觸摸上眼瞼；眼睛看上方，同法檢查下眼瞼。按壓耳珠或牽拉耳殼有疼痛，可能是<b>外耳炎</b>的徵象。</p>`},
 {id:"a-icope-v",dom:"a",group:"評估流程",title:"ICOPE 視力初評與複評",imgs:[["s40","視力初評－步驟一"],["s41","視力初評結果"],["s42","視力複評－步驟二"],["s43","WHO 簡單視力圖與高風險調查表"]],html:`
  <p><b>初評</b>：1. 您是否罹患糖尿病？　2-1.（非糖尿病）您的眼睛是否有任何問題，看遠、看近或閱讀有困難，或眼睛有疾病？　2-2.（糖尿病）您過去一年「未曾」接受眼睛檢查？　第二題答「是」，進行 WHO 簡單視力表或 Snellen test。</p>
  <p><b>複評（WHO 簡單視力圖）</b></p>
  <ul><li>遠距離：在 3 公尺處用 4 個小 E 測試，看到至少 3 個方向即通過（視力 6/18 或更佳）。</li>
  <li>近距離：手持近距離測試卡，以平常看書的距離看到至少 3 個大 E 方向即通過。</li>
  <li>遠、近任一項未通過：評估長者狀況轉介眼科；兩項均通過：接續<b>高風險個案之眼科檢查調查表</b>，任一項「是」建議接受眼科檢查。</li></ul>
  <p>視力損傷分級：輕度 &lt; 6/12、中度 &lt; 6/18、重度 &lt; 6/60、失明 &lt; 3/60。</p>`},
 {id:"a-icope-h",dom:"a",group:"評估流程",title:"ICOPE 聽力初評與複評",imgs:[["s44","聽力初評－步驟一"],["s46","聽力初評結果"],["s47","聽力複評－社會支持需求評估"]],html:`
  <p><b>初評（耳語測試）</b>：在相對安靜的空間，確定一個耳朵能清楚聽到對方氣音的環境。施測者站在長者側後方一手臂的距離，以輕柔氣音說三個數字（6、1、9），請長者複誦；未能正確複誦，再測另三個數字（2、5、7）。換另一耳重複。任一耳聽不到填「否」，請進一步評估並依情況轉介。</p>
  <p><b>複評（社會支持需求）</b>：1. 是否覺得很孤單？ 2. 日常生活不常參加與人互動的活動？任一為「是」者：</p>
  <ol><li>轉介至專業聽力照護，評估並提供助聽設備（助聽器、人工耳蝸、個人聲音擴音器）。</li>
  <li>參與社交互動可降低認知下降、憂鬱及聽力損失引起的情緒和其他風險。</li>
  <li>朋友和家庭成員可以幫助預防孤獨和孤立。</li>
  <li>家中環境調整，如將門鈴和電話放在屋內都能聽到的位置。</li></ol>`},
];

/* ============ 判讀輔助 ============ */
function rinneEar(r,side){const b=parseFloat(r[side+"B"]),a=parseFloat(r[side+"A"]);if(isNaN(a)||isNaN(b))return null;return a>b?"pos":"neg";}
function interpTuning(S){
  const r=S.hrinne||{}, R=rinneEar(r,"R"), L=rinneEar(r,"L"), w=S.hweber;
  if(!w&&!R&&!L) return null;
  const lines=[];
  const txt=x=>x==="pos"?"AC&gt;BC 陽性（正常或感覺神經性）":"BC≥AC 陰性（傳導性聽力喪失可能）";
  if(R) lines.push("右耳 Rinne："+txt(R));
  if(L) lines.push("左耳 Rinne："+txt(L));
  if(w&&R&&L){
    let c;
    if(w.startsWith("兩耳")) c=(R==="pos"&&L==="pos")?"Weber 置中且兩耳 AC&gt;BC：未見單側傳導性或感覺神經性聽損的典型表現。":(R==="neg"&&L==="neg")?"Weber 置中、兩耳皆 BC≥AC：可能為雙側傳導性聽力喪失。":"結果不一致，請重新施測或轉介耳鼻喉科。";
    else{const side=w.includes("右")?"R":"L",other=side==="R"?"L":"R",nm={R:"右耳",L:"左耳"},rs={R,L};
      if(rs[side]==="neg") c="Weber 偏向"+nm[side]+"，且"+nm[side]+" BC≥AC：符合"+nm[side]+"<b>傳導性</b>聽力喪失（患耳較清楚）。";
      else if(R==="pos"&&L==="pos") c="Weber 偏向"+nm[side]+"，兩耳 AC&gt;BC：符合"+nm[other]+"<b>感覺神經性</b>聽力喪失（健耳較清楚）。";
      else c="結果不一致，請重新施測或轉介耳鼻喉科。";}
    lines.push(c);
  }
  return ["info","判讀參考（依教材規則推算，請自行核對）",lines.join("<br>")];
}
function sumVision(S){const a=[];
  if(S.vq2==="是")a.push("ICOPE 初評第二題答「是」");
  if(S.vfar==="否")a.push("WHO 遠距離視力測試未通過");
  if(S.vnear==="否")a.push("WHO 近距離視力測試未通過");
  if(S.vhr1==="是")a.push("有眼睛疾病但未定期回診追蹤");
  if(S.vhr2==="是")a.push("有慢性疾病但過去 1 年未接受眼科檢查");
  if(S.vamsler==="線條歪曲")a.push("阿姆斯勒方格表：線條歪曲");
  if(S.vcolor==="否")a.push("紅綠色盲測試未正確念出數字");
  if(S.vcontrast==="否")a.push("對比敏感度測試未正確念出數字");
  if(!a.length) return ["info","異常發現整理","目前尚無異常項目。完成上方評估後，這裡會列出需要處置的發現。"];
  return ["bad","異常發現整理（"+a.length+" 項）","<ol>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ol>請據此勾選處置並撰寫建議。"];}
function sumHearing(S){const a=[];
  if(S.hboth==="否")a.push("耳語測試：未能兩耳都聽得到");
  if(S.hweber&&!S.hweber.startsWith("兩耳"))a.push("Weber's Test "+S.hweber);
  const r=S.hrinne||{};if(rinneEar(r,"R")==="neg")a.push("右耳 Rinne 陰性（BC≥AC）");if(rinneEar(r,"L")==="neg")a.push("左耳 Rinne 陰性（BC≥AC）");
  if(S.hlonely==="是")a.push("覺得很孤單");if(S.hsocial==="是")a.push("不常參加與人互動之活動");
  if(!a.length) return ["info","異常發現整理","目前尚無異常項目。完成上方評估後，這裡會列出需要處置的發現。"];
  return ["bad","異常發現整理（"+a.length+" 項）","<ol>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ol>請據此勾選處置並撰寫建議。"];}

const vis=i=>!i.show||i.show(S);
function answered(i){const v=S[i.id];
  switch(i.type){
    case "note":return true;
    case "checks":case "icope":return Array.isArray(v)&&v.length>0;
    case "checklist":return Array.isArray(v)&&v.length===i.opts.length;
    case "whisper":{const w=v||{};return ["R","L"].every(s=>w[s+"1"]==="正確"||(w[s+"1"]==="不正確"&&!!w[s+"2"]));}
    case "rinne":{const r=v||{};return ["RB","RA","LB","LA"].every(k=>r[k]!==undefined&&r[k]!=="");}
    case "family":return !!(v&&String(v).trim())||!!S.tree_img;
    case "radio":return !!v&&(!i.other||v!==i.other||!!(S[i.id+"_o"]||"").trim());
    default:return v!==undefined&&String(v).trim()!=="";
  }}
const countable=i=>i.type!=="note"&&!i.opt&&vis(i);
function unitStat(u){const its=u.secs.flatMap(s=>s.items).filter(countable);return [its.filter(answered).length,its.length];}

const AMSLER=(()=>{let l="";for(let k=0;k<=200;k+=10){l+=`<line x1="${k}" y1="0" x2="${k}" y2="200"/><line x1="0" y1="${k}" x2="200" y2="${k}"/>`;}
  return `<div class="amsler"><svg viewBox="-2 -2 204 204" role="img" aria-label="阿姆斯勒方格表"><g stroke="currentColor" stroke-width=".6" fill="none" style="color:var(--ink)">${l}</g><circle cx="100" cy="100" r="3" fill="currentColor" style="color:var(--ink)"/></svg>

function inputHTML(i){const v=S[i.id];const name=i.id;

   case "number":return `<input type="number" id="f-${name}" data-k="${name}" value="${esc(v)}" min="0" max="130" style="max-width:160px">`;

   case "checks":case "checklist":{const a=Array.isArray(v)?v:[];return `<div class="choices">${i.opts.map((o,k)=>`<label class="choice sq"><input type="checkbox" id="f-${name}-${k}" data-k="${name}" value="${esc(o)}" ${a.includes(o)?"checked":""}><span>${i.type==="checklist"?"✓ ":""}${esc(o)}</span></label>`).join("")}</div>`;}

     ${S.tree_img?`<img class="tree-img" src="${S.tree_img}" alt="家族樹照片">`:""}`;
   case "whisper":{const w=v||{};const ear=(s,n)=>`<div class="ear"><h5>${n}</h5>
      <div class="row"><small>第一組：6、1、9</small><div class="choices">${["正確","不正確"].map((o,k)=>`<label class="choice"><input type="radio" name="w-${s}1" id="f-w-${s}1-${k}" data-w="${s}1" value="${o}" ${w[s+"1"]===o?"checked":""}><span>${o}</span></label>`).join("")}</div></div>
      <div class="row" ${w[s+"1"]==="不正確"?"":"hidden"} data-w2="${s}"><small>第二組：2、5、7</small><div class="choices">${["正確","不正確"].map((o,k)=>`<label class="choice"><input type="radio" name="w-${s}2" id="f-w-${s}2-${k}" data-w="${s}2" value="${o}" ${w[s+"2"]===o?"checked":""}><span>${o}</span></label>`).join("")}</div></div>
      <div class="res" data-wres="${s}"></div></div>`;
     return `<div class="subgrid">${ear("R","右耳")}${ear("L","左耳")}</div>`;}
   case "rinne":{const r=v||{};const ear=(s,n)=>`<div class="ear"><h5>${n}</h5>
      <div class="subgrid" style="grid-template-columns:1fr 1fr"><label class="row"><small>BC 秒數</small><input type="number" step="0.5" min="0" id="f-r-${s}B" data-r="${s}B" value="${esc(r[s+"B"])}"></label><label class="row"><small>AC 秒數</small><input type="number" step="0.5" min="0" id="f-r-${s}A" data-r="${s}A" value="${esc(r[s+"A"])}"></label></div>
      <div class="res" data-rres="${s}"></div></div>`;
     return `<div class="subgrid">${ear("R","右耳")}${ear("L","左耳")}</div>`;}
   case "icope":{const a=Array.isArray(v)?v:[];return `<div class="icope">${i.groups.map(g=>`<div class="grp ${g.k}"><b>${g.label}</b>${g.rows.map(([rl,os])=>`<div class="r"><span>${rl}</span><div class="choices">${os.map((o,k)=>{const val=g.label+"｜"+rl+"："+o;return `<label class="choice sq"><input type="checkbox" id="f-${name}-${esc(rl)}-${k}" data-k="${name}" value="${esc(val)}" ${a.includes(val)?"checked":""}><span>${esc(o)}</span></label>`;}).join("")}</div></div>`).join("")}</div>`).join("")}
     <input type="text" id="f-${name}_o" data-k="${name}_o" value="${esc(S[name+"_o"])}" placeholder="選「其他」時請說明"></div>`;}

function refresh(){
  const u=UNITS.find(x=>x.id===UI.unit);
  u.secs.forEach(s=>s.items.forEach(i=>{
    if(i.type==="note"){const slot=$(`[data-note="${i.id}"]`);if(!slot)return;const r=i.fn(S);slot.innerHTML=r?`<div class="note ${r[0]}"><b>${r[1]}</b>${r[2]}</div>`:"";return;}
    const el=$("#it-"+i.id);if(!el)return;el.hidden=!vis(i);el.classList.toggle("ok",answered(i));
    if(i.labelFn){const l=$("[data-lbl]",el);l.textContent=i.labelFn(S);}
    if(i.other){const o=$("#f-"+i.id+"_o");if(o)o.hidden=S[i.id]!==i.other;}
  }));
  if(UI.unit==="hearing"){const w=S.hwhisper||{};["R","L"].forEach(s=>{const box=$(`[data-w2="${s}"]`);if(box)box.hidden=w[s+"1"]!=="不正確";
     const res=$(`[data-wres="${s}"]`);const p=w[s+"1"]==="正確"||w[s+"2"]==="正確",f=w[s+"1"]==="不正確"&&w[s+"2"]==="不正確";
     if(res){res.className="res"+(p?" ok":f?" bad":"");res.textContent=p?"能正確複誦：聽得到":f?"兩組皆未能正確複誦：聽不到":"尚未完成";}});
    const r=S.hrinne||{};["R","L"].forEach(s=>{const res=$(`[data-rres="${s}"]`);const x=rinneEar(r,s);if(res){res.className="res"+(x==="pos"?" ok":x==="neg"?" bad":"");res.innerHTML=x==="pos"?"AC &gt; BC：陽性":x==="neg"?"BC ≥ AC：陰性（傳導性可能）":"填入兩個秒數後顯示";}});}
  const [a,b]=unitStat(u);$("#unit-meta").textContent=`已完成 ${a} / ${b} 項`;
  $("#rail").innerHTML=railHTML();$("#mrail").innerHTML=railHTML();
  let A=0,B=0;UNITS.forEach(x=>{const [p,q]=unitStat(x);A+=p;B+=q;});$("#prog").style.width=(B?A/B*100:0)+"%";
  $("#case-text").textContent=S.scenario||SCENARIO;
}
function nextOpen(fromId){
  const u=UNITS.find(x=>x.id===UI.unit);const its=u.secs.flatMap(s=>s.items).filter(i=>countable(i));
  let start=fromId?its.findIndex(i=>i.id===fromId)+1:0;
  const order=[...its.slice(start),...its.slice(0,start)];
  return order.find(i=>!answered(i));
}
function focusItem(i){const el=$("#it-"+i.id);if(!el)return;$$(".item.focus").forEach(x=>x.classList.remove("focus"));el.classList.add("focus");el.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>el.classList.remove("focus"),1600);}

/* 自動計算年齡、兩耳結果 */
function derive(k){
  if((k==="birth"||k==="datetime")&&S.birth){const ref=S.datetime?new Date(S.datetime):new Date(),b=new Date(S.birth);if(!isNaN(b)){let a=ref.getFullYear()-b.getFullYear();const m=ref.getMonth()-b.getMonth();if(m<0||(m===0&&ref.getDate()<b.getDate()))a--;if(a>=0&&a<130){S.age=String(a);const f=$("#f-age");if(f)f.value=a;}}}
  if(k==="hwhisper"){const w=S.hwhisper||{};const st=s=>w[s+"1"]==="正確"||w[s+"2"]==="正確"?1:(w[s+"1"]==="不正確"&&w[s+"2"]==="不正確")?0:null;const R=st("R"),L=st("L");
    if(R!==null&&L!==null){S.hboth=(R&&L)?"是":"否";$$('input[name="r-hboth"]').forEach(x=>x.checked=x.value===S.hboth);}}
}
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.k){const k=t.dataset.k,i=BY[k];
    if(t.type==="checkbox"){const a=Array.isArray(S[k])?S[k]:[];S[k]=t.checked?[...new Set([...a,t.value])]:a.filter(x=>x!==t.value);}
    else S[k]=t.value;
    derive(k);save();refresh();
    if(UI.auto&&t.type==="radio"&&i&&answered(i)){const n=nextOpen(k);if(n)setTimeout(()=>focusItem(n),260);}
  }
  if(t.dataset.w){S.hwhisper={...(S.hwhisper||{}),[t.dataset.w]:t.value};if(t.dataset.w.endsWith("1")&&t.value==="正確"){delete S.hwhisper[t.dataset.w[0]+"2"];}derive("hwhisper");save();refresh();}
  if(t.dataset.r){S.hrinne={...(S.hrinne||{}),[t.dataset.r]:t.value};save();refresh();}
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="opt-auto"){UI.auto=t.checked;saveUI();}

  if(t.id==="f-import"&&t.files[0]){try{const d=JSON.parse(await t.files[0].text());if(typeof d!=="object"||!d)throw 0;S=d;save();renderForm();toast("已載入作答檔");}catch(err){toast("檔案格式不正確，請選擇先前下載的作答檔（.json）");}closeModal();}
});
function shrink(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82));};im.src=r.result;};r.readAsDataURL(file);});}

document.addEventListener("click",e=>{const t=e.target.closest("button,img[data-zoom],.scrim,.lightbox");if(!t)return;

  if(t.dataset.learn){openDrawer(t.dataset.learn);return;}
  if(t.dataset.unit){UI.unit=t.dataset.unit;saveUI();renderForm();window.scrollTo(0,0);return;}
  if(t.dataset.fill){S[t.dataset.fill]=t.dataset.v;$("#f-"+t.dataset.fill).value=t.dataset.v;save();refresh();if(UI.auto){const n=nextOpen(t.dataset.fill);if(n)setTimeout(()=>focusItem(n),200);}return;}

  if(t.id==="btn-export"||t.id==="btn-export2"){openExport();return;}
  if(t.dataset.exportUnit){exportPDF([t.dataset.exportUnit],t);return;}
  if(t.id==="btn-reset"){if(t.dataset.arm){S={};ALL.forEach(i=>{if(i.def)S[i.id]=i.def;});save();renderForm();toast("已清除全部作答");}else{t.dataset.arm="1";t.textContent="再按一次確認清除";t.style.color="var(--warn)";setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent="清除全部作答";t.style.color="";}},3500);}return;}

});

/* ============ PDF ============ */
function fmt(i){const v=S[i.id];const E='<span class="empty">（未填）</span>';
  switch(i.type){
   case "checks":case "checklist":case "icope":{const a=Array.isArray(v)?v:[];if(!a.length)return E;let s=a.map(x=>"☑ "+esc(x)).join("\n");if(i.type==="icope"&&S[i.id+"_o"])s+="\n說明："+esc(S[i.id+"_o"]);if(i.type==="checklist"){const miss=i.opts.filter(o=>!a.includes(o));if(miss.length)s+="\n☐ "+miss.map(esc).join("　☐ ");}return s;}
   case "radio":{if(!v)return E;let s="☑ "+esc(v);if(i.other&&v===i.other&&S[i.id+"_o"])s+="："+esc(S[i.id+"_o"]);if(i.withNote&&S[i.id+"_n"])s+="\n補充："+esc(S[i.id+"_n"]);return s;}
   case "whisper":{const w=v||{};const ear=(s,n)=>{const a=w[s+"1"],b=w[s+"2"];if(!a)return n+"：未測";return n+"：6、1、9 "+a+(a==="不正確"?"；2、5、7 "+(b||"未測"):"");};return ear("R","右耳")+"\n"+ear("L","左耳");}
   case "rinne":{const r=v||{};const ear=(s,n)=>{const x=rinneEar(r,s);return `${n}：BC ${r[s+"B"]||"—"} 秒／AC ${r[s+"A"]||"—"} 秒${x?"（"+(x==="pos"?"AC>BC 陽性":"BC≥AC 陰性")+"）":""}`;};return ear("R","右耳")+"\n"+ear("L","左耳");}
   case "family":{let s=v?esc(v):"";if(S.tree_img)s+=(s?"\n":"")+`<img src="${S.tree_img}">`;return s||E;}
   default:return v!==undefined&&String(v).trim()!==""?esc(v):E;}}
function reportBlocks(ids){const out=[];
  const head=document.createElement("div");head.className="rp-block";
  head.innerHTML=`<h1>高齡周全性健康評估問卷－視力聽力</h1><div class="sub">亞洲大學長期照護學系｜高齡周全性健康評估與實作｜匯出內容：${ids.map(id=>UNITS.find(u=>u.id===id).key+". "+UNITS.find(u=>u.id===id).title).join("、")}</div>
  <table><tr><th style="width:16%">組別</th><td>${esc(S.group)||'<span class="empty">（未填）</span>'}</td><th style="width:20%">評估日期及時間</th><td>${esc((S.datetime||"").replace("T"," "))||'<span class="empty">（未填）</span>'}</td></tr>
  <tr><th>評估者</th><td>${esc(S.assessor)||'<span class="empty">（未填）</span>'}</td><th>受評者</th><td>${esc(S.client)||'<span class="empty">（未填）</span>'}</td></tr>
  <tr><th>情境設定</th><td colspan="3">${esc(S.scenario||SCENARIO)}</td></tr></table>`;
  out.push(head);
  ids.forEach(id=>{const u=UNITS.find(x=>x.id===id);
    const h=document.createElement("div");h.className="rp-block";h.innerHTML=`<h2 class="${u.dom}">${u.key}. ${u.title}</h2>`;out.push(h);
    u.secs.forEach(s=>{const rows=[];
      s.items.forEach(i=>{if(i.type==="note"){if(["v_sum","h_sum","h_interp"].includes(i.id)){const r=i.fn(S);if(r&&r[0]!=="info"||i.id==="h_interp"&&r)rows.push(`<tr><td class="k">${r[1]}</td><td>${r[2].replace(/<br>/g,"\n").replace(/<\/li>/g,"\n").replace(/<[^>]+>/g,"").trim()}</td></tr>`);}return;}
        if(!vis(i))return;if(["scenario","group","datetime","assessor","client"].includes(i.id))return;
        rows.push(`<tr><td class="k">${esc(i.labelFn?i.labelFn(S):i.label)}</td><td>${fmt(i)}</td></tr>`);});
      if(!rows.length)return;
      const b=document.createElement("div");b.className="rp-block";b.innerHTML=`<table><tr><td colspan="2" class="sect">${s.title}</td></tr>${rows.join("")}</table>`;out.push(b);});
  });
  return out;}
function saveFile(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return Promise.resolve();}
async function exportPDF(ids,btn){
  const msg=$("#x-msg");const say=(m,c)=>{if(msg){msg.textContent=m;msg.className="msg "+(c||"");}else toast(m);};
  if(!window.html2canvas||!window.jspdf){say("PDF 元件尚未載入，請稍候再試","bad");return;}
  const old=btn.textContent;btn.disabled=true;btn.textContent="產生中…";
  try{
    await document.fonts.ready;
    const host=$("#report");host.innerHTML="";const wrap=document.createElement("div");wrap.className="rp";host.appendChild(wrap);
    const blocks=reportBlocks(ids);blocks.forEach(b=>wrap.appendChild(b));
    await Promise.all($$("img",wrap).map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"mm",format:"a4"});
    const M=12,W=210-2*M,H=297-2*M-6;let y=M,page=1;
    const footer=()=>{pdf.setFontSize(8);pdf.setTextColor(140);pdf.text(String(page),105,297-7,{align:"center"});};
    for(const b of blocks){
      const c=await html2canvas(b,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false});
      const mmPerPx=W/c.width;let hmm=c.height*mmPerPx;
      if(hmm<=H){if(y+hmm>M+H){footer();pdf.addPage();page++;y=M;}pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",M,y,W,hmm);y+=hmm+2;}
      else{let sy=0;while(sy<c.height){let avail=M+H-y;if(avail<20){footer();pdf.addPage();page++;y=M;avail=H;}const sliceH=Math.min(c.height-sy,Math.floor(avail/mmPerPx));const sc=document.createElement("canvas");sc.width=c.width;sc.height=sliceH;const x=sc.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,sc.width,sc.height);x.drawImage(c,0,sy,c.width,sliceH,0,0,c.width,sliceH);pdf.addImage(sc.toDataURL("image/jpeg",.92),"JPEG",M,y,W,sliceH*mmPerPx);y+=sliceH*mmPerPx+2;sy+=sliceH;}}
    }
    footer();host.innerHTML="";
    const blob=pdf.output("blob");
    const part=ids.length===UNITS.length?"完整":ids.map(id=>UNITS.find(u=>u.id===id).title).join("+");
    const fname=`視力聽力評估單_${S.group?S.group+"組_":""}${S.assessor||"學生"}_${part}.pdf`.replace(/[\\/:*?"<>|]/g,"");
    await saveFile(fname,blob);say("已產生 PDF："+fname,"ok");
  }catch(err){const c=err&&err.code;say(c==="declined"?"已取消下載":c==="rate_limited"?"已有一個下載視窗開啟，請先處理後再試":"產生 PDF 時發生問題，請再試一次","bad");}
  finally{btn.disabled=false;btn.textContent=old;}
}
async function saveJSON(btn){const msg=$("#x-msg");
  try{await saveFile(`視力聽力評估單作答檔_${S.assessor||"學生"}.json`,new Blob([JSON.stringify(S)],{type:"application/json"}));msg.textContent="已下載作答檔";msg.className="msg ok";}
  catch(err){msg.textContent=err&&err.code==="declined"?"已取消下載":"下載失敗，請再試一次";msg.className="msg bad";}}

renderForm();
if(UI.mode==="learn")setMode("learn");else setMode("form");
const h=location.hash.slice(1);if(T[h]){setMode("learn");setTimeout(()=>{const el=document.getElementById(h);if(el)el.scrollIntoView();},50);}
